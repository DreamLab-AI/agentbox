services:
  gui-tools-service:
    container_name: gui-tools-service
    # Hostname MUST be gui-tools-service — agentbox's blender-mcp-proxy.js bridges
    # localhost:9876 -> gui-tools-service:9876 (GUI_CONTAINER_HOST default).
    hostname: gui-tools-service
    build:
      context: ./gui-tools-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/opt/gui-tools/healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    environment:
      - DISPLAY=:2
      # ARC-002: GPU selection is operator-configurable. Default `all`; pin a
      # specific GPU by exporting NVIDIA_VISIBLE_DEVICES (a stable GPU-<uuid>).
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - XDG_RUNTIME_DIR=/tmp/xdg-runtime
      - HOME=/home/devuser
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - BLENDER_MCP_BIND=0.0.0.0
      - BLENDER_MCP_PORT=9876
      - QGIS_MCP_BIND=0.0.0.0
      - QGIS_MCP_PORT=9877
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              capabilities: [gpu, compute, utility, graphics]
              # ARC-002: operator-configurable GPU; matches NVIDIA_VISIBLE_DEVICES.
              device_ids: ['${NVIDIA_VISIBLE_DEVICES:-all}']
    ports:
      # VNC: view the Blender/QGIS desktop
      - "0.0.0.0:5905:5905"
      # BlenderMCP socket (agentbox proxy / uvx blender-mcp connect here)
      - "0.0.0.0:9876:9876"
      # QGIS MCP endpoint (stub)
      - "0.0.0.0:9877:9877"
    networks:
      - visionclaw
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  visionclaw:
    external: true
    name: visionclaw_network
