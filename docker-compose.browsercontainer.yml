services:
  browsercontainer:
    container_name: browsercontainer
    hostname: browsercontainer
    build:
      context: ./browsercontainer
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/opt/browsercontainer/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - DISPLAY=:2
      # ADR-2207 D1: the one display size (16:9 only, width 1280-3840); Xvfb,
      # Chrome's window and the recorder all read it. Changing it means a recreate.
      - BROWSER_DISPLAY_SIZE=${BROWSER_DISPLAY_SIZE:-1920x1080}
      # ARC-002: GPU selection is operator-configurable. Default `all`; pin a
      # specific GPU by exporting NVIDIA_VISIBLE_DEVICES (e.g. a stable
      # GPU-<uuid>) in the environment / .env before compose up.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - SIDECAR_TRANSPORT=sse
      - SIDECAR_PORT=8931
      # ADR-2207 D2: the exchange volume's mount; the MCP child runs there (cwd and
      # TMPDIR), so files land at the same absolute path agentbox sees.
      - BROWSER_EXCHANGE_DIR=/home/devuser/exchange
      - XDG_RUNTIME_DIR=/tmp/xdg-runtime
      - HOME=/home/devuser
      # Treat dev/LAN origins as secure contexts. Required for:
      #   - SharedArrayBuffer (zero-copy position pipeline)
      #   - navigator.gpu (WebGPU) — Chrome refuses to expose `gpu` on
      #     non-secure origins. Without `visionclaw_container:3001` in
      #     this list, the client silently falls back to WebGL and the
      #     embedding-cloud rendering path swamps the GPU.
      - TREAT_AS_SECURE=http://agentbox:8795,http://visionclaw_container:3001,http://visionclaw_container:3000,http://visionclaw_container:4000,http://the model host:3001,http://the model host:3000,http://host.docker.internal:3001,http://host.docker.internal:3000
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
          devices:
            - driver: nvidia
              capabilities: [gpu, compute, utility, graphics]
              # ARC-002: operator-configurable GPU; matches NVIDIA_VISIBLE_DEVICES.
              device_ids: ['${NVIDIA_VISIBLE_DEVICES:-all}']
    ports:
      # VNC: view Chrome desktop
      - "${AGENTBOX_SIDECAR_BIND:-127.0.0.1}:5903:5903"
      # MCP SSE: chrome-devtools-mcp bridge (agents connect here)
      - "${AGENTBOX_SIDECAR_BIND:-127.0.0.1}:8931:8931"
      # CDP proxy: host:9222 → socat:9223 → Chrome:9222
      # socat rebinds so CDP /json/list returns connectable ws:// URLs
      - "${AGENTBOX_SIDECAR_BIND:-127.0.0.1}:9222:9223"
    networks:
      - visionclaw
    shm_size: '2gb'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared exchange volume — agentbox/gui-tools hand-offs (Mermaid no longer renders here, ADR-2154).
      - gui-tools-exchange:/home/devuser/exchange
      # Chrome profile (W9): Podkey's chrome.storage.local (encrypted key vault,
      # public key, consent grants) must survive container recreation.
      - browsercontainer-profile:/home/devuser/chrome-profile
      # Compatibility with retained images whose Chrome still uses /tmp.
      # Both paths share one durable profile; remove after all images migrate.
      - browsercontainer-profile:/tmp/chrome-profile

networks:
  visionclaw:
    external: true
    name: visionclaw_network

volumes:
  # ADR-2207 D2: pinned to the live name (the same in every compose file), so
  # agentbox and every sidecar share one exchange whatever the project name.
  gui-tools-exchange:
    name: ${GUI_TOOLS_EXCHANGE_VOLUME:-agentbox_gui-tools-exchange}
  # Stable name, independent of the compose project. Holds the sidecar's identity
  # (K_browser, sealed in Podkey's vault): never `down -v` this file.
  browsercontainer-profile:
    name: browsercontainer-profile
