[package]
name = "colloquy-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "Apache-2.0"
description = "One KnowledgeStore contract over cq's three tiers: a local append-only file, shared vector memory, and a Nostr relay. Transports are traits, so the mapping is testable without a database or a network."
readme = "README.md"
keywords = ["agents", "knowledge", "cq", "storage"]
categories = ["database"]

[dependencies]
colloquy-core = { path = "../colloquy-core", version = "0.1" }
colloquy-nostr = { path = "../colloquy-nostr", version = "0.1" }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "fs", "io-util", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
