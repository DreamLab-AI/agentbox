[package]
name = "sidestr-nostr"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "The Nostr plane of sidestr sidechains: an owned NIP-01 event with BIP-340 verification, a sealed signer port, the tip announcement (kind 33333) with the mirror trust rule, transactions and faucet requests (23500/23501), rule and genesis documents (33500/33501), the dual-schema 33502 record decoded as peg record, pledge or ambiguous, the level-2 round event codecs, and the agentbox account binding and settlement events (38420-38425). A port of siding by Melvin Carvalho."
readme = "README.md"
documentation = "https://docs.rs/sidestr-nostr"
keywords = ["bitcoin", "sidechain", "sidestr", "nostr", "nip-333"]
categories = ["cryptography::cryptocurrencies", "encoding", "network-programming"]
publish = true
include = ["src/**", "tests/**", "fixtures/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[dependencies]
sidestr-core = { path = "../sidestr-core", version = "0.2" }
bitcoin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
