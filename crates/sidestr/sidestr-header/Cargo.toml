[package]
name = "sidestr-header"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"
description = "Block headers for sidestr sidechains, following the parent chain's family: the stock 80-byte SHA-256d header and Bitcoin Knots' 164-byte v2 header with the tagged-hash-plus-BLAKE2b proof of work, compact targets, powLimit checks and the BIP-325 block data. no_std, RustCrypto only. A port of bitcoin-desktop/schema and siding by Melvin Carvalho."
readme = "README.md"
documentation = "https://docs.rs/sidestr-header"
keywords = ["bitcoin", "sidechain", "sidestr", "blake2b", "block-header"]
categories = ["cryptography::cryptocurrencies", "encoding", "no-std"]
publish = true
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
default = ["std"]
# `std::error::Error` for the error type and the hashers' std features.
# Without it the crate is `#![no_std]` and needs no allocator.
std = ["sha2/std", "blake2/std"]

[dependencies]
# Declared directly rather than through the workspace table so that
# `default-features = false` keeps the no_std build honest.
sha2 = { version = "0.10", default-features = false }
blake2 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = { workspace = true }
