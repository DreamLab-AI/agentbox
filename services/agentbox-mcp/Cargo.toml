[workspace]

[package]
name = "agentbox-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Unified multi-tool MCP server for agentbox (imagemagick, web-summary, gemini-url-context)."

[[bin]]
name = "agentbox-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3.4"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.2", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
