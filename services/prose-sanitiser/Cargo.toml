# prose-sanitiser workspace.
#
# The split follows dependency and licence hygiene: `core`, `unicode`, `uk` and
# `slop` are pure Rust with no filesystem access and no subprocesses, which is
# the part worth publishing to crates.io. `media` pulls the heavier tree (zip,
# quick-xml, external tool invocation), `cli` wires the binaries together and
# `server` carries the axum surface.
#
#   prose-sanitiser-core     shared types; no I/O, no subprocesses
#   prose-sanitiser-unicode  Layer A invisible-Unicode and homoglyph surgery
#   prose-sanitiser-uk       UK-English spelling enforcement
#   prose-sanitiser-slop     AI-tell rule tables and scanners
#   prose-sanitiser-media    image and container provenance surgery
#   prose-sanitiser          the CLI binaries, audit sweeps and rewrite layer
#   prose-sanitiser-server   the HTTP service (unpublished)
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/unicode",
    "crates/uk",
    "crates/slop",
    "crates/media",
    "crates/cli",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DreamLab-AI/agentbox"

[workspace.dependencies]
prose-sanitiser-core = { path = "crates/core", version = "0.1.0" }
prose-sanitiser-unicode = { path = "crates/unicode", version = "0.1.0" }
prose-sanitiser-uk = { path = "crates/uk", version = "0.1.0" }
prose-sanitiser-slop = { path = "crates/slop", version = "0.1.0" }
prose-sanitiser-media = { path = "crates/media", version = "0.1.0" }
prose-sanitiser = { path = "crates/cli", version = "0.1.0" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
quick-xml = "0.37"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
unicode_names2 = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
