[package]
name = "prose-sanitiser-unicode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic invisible-Unicode surgery for prose: decodes variation-selector, tag-block and zero-width steganographic payloads, detects UTS #39 homoglyph and mixed-script substitution, and applies a context-aware bidi policy (Trojan Source in code, balanced controls preserved in RTL prose)."
keywords = ["unicode", "homoglyph", "steganography", "security", "confusables"]
categories = ["text-processing", "internationalization"]
readme = "README.md"

[dependencies]
prose-sanitiser-core = { workspace = true }
serde_json = { workspace = true }
unicode-general-category = { workspace = true }
# UTS #39 confusables, skeleton, mixed-script and restriction levels. Declared
# here rather than in [workspace.dependencies] because this is the only crate
# that does Unicode security analysis. MIT/Apache-2.0, no C dependencies.
unicode-security = "0.1.2"
# The script-property half of the same UTS #39 analysis. Pinned to the version
# `unicode-security` itself resolves, so both halves read one set of tables.
unicode-script = "0.5"
unicode-normalization = { workspace = true }
unicode_names2 = { workspace = true }
