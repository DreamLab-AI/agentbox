[package]
name = "prose-sanitiser-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Lossless container-level provenance surgery: C2PA/JUMBF, EXIF, XMP and IPTC removal from PNG/JPEG/WebP, and metadata scrubbing for SVG, PDF, OOXML, ODF, HTML and Markdown."
keywords = ["c2pa", "exif", "xmp", "metadata", "provenance"]
categories = ["multimedia::images", "filesystem"]
readme = "README.md"

[features]
default = ["c2pa-read"]
# Read and validate embedded C2PA manifests with the official `c2pa` crate.
# Read-only: removal is always the container-level surgery in `image` and
# `container`, never the SDK.
c2pa-read = ["dep:c2pa"]
# Optional cross-check against the external `exiftool`, `c2patool` and `qpdf`
# binaries. Advisory only: never part of the implementation path.
external-verify = []

[dependencies]
prose-sanitiser-core = { workspace = true }
prose-sanitiser-unicode = { workspace = true }
libc = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }

# Lossless container surgery. `img-parts` owns every JPEG segment, PNG chunk
# and RIFF chunk read and write; `lopdf` owns the PDF object graph.
crc32fast = "1"
img-parts = "0.4"
lopdf = { version = "0.44", default-features = false }

# C2PA read and validate only. `default-features = false` drops the OpenSSL C
# dependency and every HTTP backend, so no remote manifest can be fetched and
# nothing leaves the machine.
c2pa = { version = "0.90", default-features = false, features = ["rust_native_crypto"], optional = true }

[dev-dependencies]
# Decodes both sides of a strip so the pixel-identity assertion is exact
# rather than a PSNR threshold, and encodes the fixtures so the integration
# tests need no checked-in binaries and no external tools.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Also a dependency; repeated here so the integration tests can build the
# marked fixtures with the same container library the crate uses.
img-parts = "0.4"
sha2 = { workspace = true }
