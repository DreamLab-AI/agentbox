[package]
name = "prose-sanitiser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic AI-provenance sanitiser for agentbox: invisible-Unicode and homoglyph surgery, PNG/JPEG/WebP metadata stripping, container (SVG/PDF/DOCX/ODT/HTML/Markdown) scrubbing, slop scanning and UK-English enforcement, as CLIs."
keywords = ["sanitiser", "provenance", "unicode", "metadata", "cli"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
# Every binary is declared explicitly below; without this, cargo would also
# auto-discover src/bin/*.rs and ship duplicate snake_case names.
autobins = false

[lib]
name = "prose_sanitiser"
path = "src/lib.rs"

[[bin]]
name = "inspect-text"
path = "src/bin/inspect_text.rs"

[[bin]]
name = "clean-text"
path = "src/bin/clean_text.rs"

[[bin]]
name = "inspect-image"
path = "src/bin/inspect_image.rs"

[[bin]]
name = "clean-image"
path = "src/bin/clean_image.rs"

[[bin]]
name = "inspect-file"
path = "src/bin/inspect_file.rs"

[[bin]]
name = "clean-file"
path = "src/bin/clean_file.rs"

[[bin]]
name = "audit-dir"
path = "src/bin/audit_dir.rs"

[[bin]]
name = "audit-website"
path = "src/bin/audit_website.rs"

[[bin]]
name = "rewrite-text"
path = "src/bin/rewrite_text.rs"

[[bin]]
name = "slop-scan"
path = "src/bin/slop_scan.rs"

[[bin]]
name = "slop-detect"
path = "src/bin/slop_detect.rs"

[dependencies]
prose-sanitiser-core = { workspace = true }
prose-sanitiser-media = { workspace = true }
prose-sanitiser-slop = { workspace = true }
prose-sanitiser-uk = { workspace = true }
prose-sanitiser-unicode = { workspace = true }
clap = { workspace = true }
flate2 = { workspace = true }
quick-xml = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
