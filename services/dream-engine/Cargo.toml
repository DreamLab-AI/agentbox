[workspace]

[package]
name = "dream-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-only"
description = "Nightly evidence-gated repository evolution engine for agentbox. Compiles config into deterministic prompts, dispatches to the connected node annexe, calls LLM, parses verdicts, persists to ledger + RuVector."
repository = "https://github.com/DreamLab-AI/agentbox"
readme = "README.md"

[[bin]]
name = "dream-engine"
path = "src/main.rs"

[lib]
name = "dream_engine"
path = "src/lib.rs"

[dependencies]
# The extracted permissive crates (DreamLab-AI/dream-engine workspace; ADR-2141).
# Development pins are path dependencies; flipping to the pushed repository is
# one line per crate and every line must move to the SAME rev:
#   dream-core = { git = "https://github.com/DreamLab-AI/dream-engine", rev = "<sha>" }
# A path/git mix would link two copies of dream-gate and its types would not unify.
dream-core = { path = "/home/devuser/workspace/.tmp/dream-engine-build/crates/dream-core", version = "0.1.0" }
dream-gate = { path = "/home/devuser/workspace/.tmp/dream-engine-build/crates/dream-gate", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "signal"] }
loom-client = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
hex = "0.4"
toml = "1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
nostr-bbs-core = "=1.0.0-beta.16"
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }

[dev-dependencies]
base64 = "0.23"
tempfile = "3"
