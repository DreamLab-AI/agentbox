[workspace]

[package]
name = "dream-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "Nightly evidence-gated repository evolution engine for agentbox. Compiles config into deterministic prompts, dispatches to the connected node annexe, calls LLM, parses verdicts, persists to ledger + RuVector."
repository = "https://github.com/DreamLab-AI/agentbox"
readme = "README.md"

[[bin]]
name = "dream-engine"
path = "src/main.rs"

[lib]
name = "dream_engine"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "signal"] }
loom-client = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
hex = "0.4"
toml = "0.8"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
nostr-bbs-core = "=1.0.0-beta.11"
k256 = { version = "0.13.4", default-features = false, features = ["schnorr"] }

[dev-dependencies]
tempfile = "3"
