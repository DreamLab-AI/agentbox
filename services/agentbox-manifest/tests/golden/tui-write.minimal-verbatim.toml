[core]
orchestration = "ruflo-v3"
vector_db = "ruvector-embedded"

[federation]
mode = "standalone"

[adapters]
beads        = "local-sqlite"
pods         = "local-solid-rs"
memory       = "embedded-ruvector"
events       = "local-jsonl"
orchestrator = "local-process-manager"

[gpu]
backend = "none"

[desktop]
enabled    = false
stack      = "hyprland-wayland"
resolution = "1920x1080"

[sovereign_mesh]
enabled              = true
solid_pod            = true
nostr_bridge         = true
https_bridge         = false
publish_agent_events = false

[observability]
metrics_port  = 9091
log_level     = "info"

[consultants]
enabled              = false
intelligence_signal  = false
log_dir              = "/var/lib/agentbox/consultations"

[consultants.codex]
enabled = false
model      = "gpt-5.4"
home       = "/home/devuser/.codex"
timeout_ms = 180000

[consultants.antigravity]
enabled = false
model      = "gemini-2.5-pro"
home       = "/home/devuser/.antigravity"
timeout_ms = 180000

[consultants.zai]
enabled = false
model      = "glm-5.3"
home       = "/home/zai-user"
timeout_ms = 180000

[consultants.perplexity]
enabled = false
model      = "sonar-pro"
timeout_ms = 60000

[consultants.deepseek]
enabled = false
model      = "deepseek-v4-flash"
timeout_ms = 120000

[model_routing]
enabled             = false
primary_host        = "claude"
aqe_agent_overrides = false
dual_run            = false
aqe_llm_provider    = "claude-code"
aqe_fallback_chain  = "claude-code,codex"

[model_routing.routes]
specification     = "claude:claude-sonnet-5"
architecture      = "claude:claude-fable-5-1"
design            = "claude:claude-opus-5"
implementation    = "codex:gpt-5.5 -> claude:claude-fable-5-1"
testing           = "codex:gpt-5.5 -> claude:claude-opus-5"
review            = "claude:claude-sonnet-5"
security-scan     = "codex:gpt-5.5"
security-analysis = "claude:claude-fable-5-1"
documentation     = "codex:gpt-5.5"
debugging         = "claude:claude-fable-5-1"
packaging         = "codex:gpt-5.5"
release           = "claude:claude-sonnet-5"

[privacy_filter]
enabled = false
mode    = "off"
port    = 9092
dtype   = "bf16"
model   = "openai/privacy-filter"

[privacy_filter.policy]
pods         = "strict"
memory       = "strict"
events       = "soft"
beads        = "soft"
orchestrator = "off"
inbound      = "soft"
outbound     = "soft"

[privacy_filter.entities]
enabled = []

[providers.anthropic]
enabled  = false
env_var  = "ANTHROPIC_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.openai]
enabled  = false
env_var  = "OPENAI_API_KEY"
optional_env_vars = ["OPENAI_BASE_URL"]
auth_mode = "api_key"

[providers.gemini]
enabled  = false
env_var  = "GOOGLE_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.deepseek]
enabled  = false
env_var  = "DEEPSEEK_API_KEY"
optional_env_vars = ["DEEPSEEK_BASE_URL"]
auth_mode = "api_key"

[providers.perplexity]
enabled  = false
env_var  = "PERPLEXITY_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.openrouter]
enabled  = false
env_var  = "OPENROUTER_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.context7]
enabled  = false
env_var  = "CONTEXT7_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.brave]
enabled  = false
env_var  = "BRAVE_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.ceramic]
enabled  = false
env_var  = "CERAMIC_API_KEY"
optional_env_vars = []
auth_mode = "api_key"

[providers.github]
enabled  = false
env_var  = "GITHUB_TOKEN"
optional_env_vars = []
auth_mode = "api_key"

[providers.zai]
enabled  = false
env_var  = "ZAI_API_KEY"
optional_env_vars = ["ZAI_ANTHROPIC_API_KEY", "ZAI_URL"]
auth_mode = "api_key"

[toolchains]
claude          = true
claude_code     = false
ruflo           = true
claude_flow     = true
agentic_qe      = true
nagual_qe       = true
antigravity_cli = false
codex           = false
opencode        = false
code_server     = false
codebase_memory = true
rust            = true
cuda            = false

[skills.browser]
agent_browser = true
playwright    = true
qe_browser    = false

[skills.media]
ffmpeg           = true
imagemagick      = true
comfyui_builtin  = false

[skills.spatial_and_3d]
blender            = false
qgis               = false
gaussian_splatting = false

[skills.data_science]
pytorch = false
jupyter = false

[skills.docs]
latex          = true
mermaid        = true
report_builder = true

[skills.ontology]
enabled = false

[integrations.comfyui_external]
enabled = false
url    = "http://comfyui:8188"
ws_url = "ws://comfyui:8188/ws"

[integrations.solid_pod_rs]
port                  = 8484
bind                  = "127.0.0.1"
storage               = "fs"
storage_root          = "/var/lib/solid"
base_url              = "http://127.0.0.1:8484"
enable_oidc           = false
enable_schnorr_verify = false
enable_dpop_cache     = false
notifications          = "websocket"
log_level              = "info"
enable_did_nostr       = false
enable_webhook_signing = false
enable_rate_limit      = false
enable_quota           = false

[security.exceptions.playwright]
cap_add = ["SYS_ADMIN"]
reason = "chromium sandbox; SYS_ADMIN is the minimum privilege for Chromium user-ns sandbox inside a container"

[security.exceptions.solid-pod-rs]
writable_volumes = ["solid-data:/var/lib/solid"]
reason = "solid-pod-rs fs-backend requires atomic-rename writable storage under /var/lib/solid"

