[workspace]

[package]
name = "agentbox-manifest"
version = "0.1.0"
edition = "2021"
description = "Boot-time TOML/JSON projection for agentbox — replaces the inline python3 in config/entrypoint-unified.sh and the four manifest scripts"
license = "MIT OR Apache-2.0"

[[bin]]
name = "agentbox-manifest"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
regex = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
toml = "0.8"
