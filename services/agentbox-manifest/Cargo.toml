[workspace]

[package]
name = "agentbox-manifest"
version = "0.1.0"
edition = "2021"
description = "Boot-time TOML/JSON projection for agentbox — replaces the inline python3 in config/entrypoint-unified.sh and the four manifest scripts"
repository = "https://github.com/DreamLab-AI/agentbox"
readme = "README.md"
license = "MIT OR Apache-2.0"

[[bin]]
name = "agentbox-manifest"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25.17"
regex = "1"
sha2 = "0.10"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
toml = "1"
