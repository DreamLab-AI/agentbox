[workspace]

[package]
name = "motion-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Frame-exact renderer for the agentbox motion-designer skill: freezes an HTML page at exact times in the browser sidecar over CDP and writes frames, stills, a determinism verdict or a probe chart."
repository = "https://github.com/DreamLab-AI/agentbox"
readme = "README.md"
publish = false

[lib]
name = "motion_render"
path = "src/lib.rs"

[[bin]]
name = "motion-render"
path = "src/bin/motion_render.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
png = "0.18"
serde_json = "1"
# Synchronous WebSocket over a plain TcpStream: the sidecar's CDP port is ws://, never wss://.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"
