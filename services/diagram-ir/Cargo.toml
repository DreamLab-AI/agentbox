[workspace]

[package]
name = "diagram-ir"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic draw.io and Mermaid to normalised diagram IR extractors for agentbox's diagram-design skill. Parses bounded text and bytes; never evaluates, renders, fetches or executes input."

[[bin]]
name = "drawio-extract"
path = "src/bin/drawio_extract.rs"

[[bin]]
name = "mermaid-extract"
path = "src/bin/mermaid_extract.rs"

[[bin]]
name = "diagram-self-check"
path = "src/bin/self_check.rs"

[lib]
name = "diagram_ir"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
quick-xml = "0.37"
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = 2
