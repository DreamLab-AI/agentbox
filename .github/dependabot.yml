# Dependabot version updates. Weekly, minor and patch bumps grouped into one PR per
# ecosystem, at most two open PRs each so a Monday never floods review. Major bumps
# arrive as individual PRs. Security advisories raise their own PRs regardless of the
# schedule. renovate.json also covers npm and github-actions: if the Renovate app is
# installed on this repo, both tools will open PRs for the same bumps, so keep one. The Nix-pinned locks under config/npm-locks and lib/lockfiles
# are deliberately not listed: they are regenerated by the flake-update workflow.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    labels: ["deps"]
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/browsercontainer"
      - "/claude-zai/wrapper"
      - "/management-api"
      - "/mcp"
      - "/mcp/aci-shell"
      - "/mcp/consultants"
      - "/mcp/perplexity"
      - "/mcp/ruvnet-brain"
      - "/mcp/servers"
      - "/skills/comfyui/mcp-server"
      - "/skills/host-webserver-debug"
      - "/skills/lazy-fetch/mcp-server"
      - "/skills/terracraft/pipeline"
      - "/skills/ui-ux-pro-max-skill/cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    labels: ["deps"]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "cargo"
    directories:
      - "/crates/colloquy"
      - "/crates/headroom-napi"
      - "/crates/nostr-receipt"
      - "/crates/system-one"
      - "/scripts/activation/sidechain-witness-replay"
      - "/services/agentbox-manifest"
      - "/services/agentbox-mcp"
      - "/services/agentbox-ops"
      - "/services/agentbox-sessions"
      - "/services/agentbox-vex"
      - "/services/dream-engine"
      - "/services/explainer-tools"
      - "/services/motion-render"
      - "/services/nostr-pod-bridge"
      - "/services/podcast-ingest"
      - "/services/secret-backup"
      - "/services/skill-tools"
      - "/setup"
      - "/skills/video-production/runtime"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    labels: ["deps"]
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directories:
      - "/services/laya-engine"
      - "/services/openjev-engine"
      - "/skills/qgis/mcp-server"
      - "/skills/toprank"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    labels: ["deps"]
    commit-message:
      prefix: "deps"
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/browsercontainer"
      - "/claude-zai"
      - "/comfyui-sidecar"
      - "/concatcontainer"
      - "/gui-tools-sidecar"
      - "/isaac-sim-sidecar"
      - "/openmed-sidecar"
      - "/services/laya-engine"
      - "/services/openjev-engine"
      - "/voice/ming"
      - "/voice/nemotron"
      - "/voice/pocket"
      - "/xr-runtime"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    labels: ["deps"]
    commit-message:
      prefix: "deps"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
