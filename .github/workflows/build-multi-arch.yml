# build-multi-arch.yml
#
# Triggers: workflow_dispatch only (disabled from automatic runs 2026-05-21).
# Re-enable push/tag triggers when GHCR distribution matters.
#
# Produces: ghcr.io/dreamlab-ai/agentbox:<sha>-amd64 and :<sha>-arm64 per-arch
#           images, then assembles them into a multi-arch manifest at
#           ghcr.io/dreamlab-ai/agentbox:<sha>. On main-branch pushes the
#           :latest tag is also updated.
#
# Strategy: each arch builds on a native GitHub-hosted runner (no QEMU), using
# Nix to produce content-addressed OCI layers via nix2container.

name: Build and publish multi-arch image

on:
  workflow_dispatch:

concurrency:
  group: build-multi-arch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            nix_system: x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            nix_system: aarch64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          # Relative path lock nodes require modern Nix; match the verified builder pin.
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Restore Nix store from Cachix when the secret is configured, otherwise
      # skip silently. Configure via repo variable CACHIX_CACHE_NAME; default
      # is 'dreamlab-ai'. The secret CACHIX_AUTH_TOKEN must be set for pushes
      # to work; missing secret is tolerated (read-only cache still works).
      - name: Set up Cachix (pull + push)
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'dreamlab-ai' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install validator dependencies
        run: npm ci --ignore-scripts

      - name: Preflight — validate manifest and E021 audit gate
        run: |
          set -euo pipefail
          node scripts/agentbox-config-validate.js agentbox.toml
          echo "Preflight: agentbox.toml validates cleanly (E021 gate passed)"

      - name: Build runtime image and pinned security evidence
        run: |
          set -euo pipefail
          nix build .#runtime .#runtime.securityEvidence .#security-tools .#runtime.copyTo --no-link --json --print-build-logs > build-outputs.json
          image=$(jq -r '.[].outputs.out' build-outputs.json | while read -r p; do test ! -f "$p" || echo "$p"; done)
          ln -s "$image" result
          evidence=$(jq -r '.[].outputs.out' build-outputs.json | while read -r p; do test ! -f "$p/metadata.json" || echo "$p"; done)
          tools=$(jq -r '.[].outputs.out' build-outputs.json | while read -r p; do test ! -x "$p/bin/agentbox-vex" || echo "$p"; done)
          copier=$(jq -r '.[].outputs.out' build-outputs.json | while read -r p; do test ! -x "$p/bin/copy-to" || echo "$p"; done)
          echo "SECURITY_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "IMAGE_COPIER=$copier" >> "$GITHUB_ENV"
          scripts/security-scan.sh report --evidence "$evidence" --tools "$tools" --output security-build

      - name: Record closure size
        id: closure
        run: |
          set -euo pipefail
          path=$(readlink -f result)
          size_bytes=$(du -sb "$path" | cut -f1)
          size_mb=$(( size_bytes / 1024 / 1024 ))
          echo "size_bytes=$size_bytes" >> "$GITHUB_OUTPUT"
          echo "size_mb=$size_mb"       >> "$GITHUB_OUTPUT"
          echo "Nix closure: ${size_mb} MB (${size_bytes} bytes)"

      - name: Load image into Docker (via nix2container copyToDockerDaemon)
        # `result` is the nix2container OCI manifest JSON, not a tarball, so
        # `docker load` cannot consume it directly. The flake's runtime
        # output exposes a `copyToDockerDaemon` script that uses skopeo to
        # talk to the local docker socket.
        run: nix run .#runtime.copyToDockerDaemon

      - name: Record compressed image size
        id: compressed
        run: |
          set -euo pipefail
          size=$(docker image inspect "agentbox:runtime-${{ matrix.nix_system }}" --format '{{.Size}}')
          size_mb=$(( size / 1024 / 1024 ))
          echo "size_bytes=$size"    >> "$GITHUB_OUTPUT"
          echo "size_mb=$size_mb"    >> "$GITHUB_OUTPUT"
          echo "Compressed image: ${size_mb} MB"
          {
            echo "### Image size (${{ matrix.arch }})"
            echo "- Nix closure: ${{ steps.closure.outputs.size_mb }} MB"
            echo "- Compressed:  ${size_mb} MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard against runaway image growth
        run: |
          set -euo pipefail
          # PRD-001 §8 commits to base runtime under 4 GB compressed; fail
          # if a build drifts past 5 GB to catch regressions early. The
          # `full` / `cuda-runtime` / `gaussian-splatting` variants have
          # their own ceilings (up to 25 GB per the CUDA image target)
          # and are built by separate workflow runs.
          max_mb=5120
          actual="${{ steps.compressed.outputs.size_mb }}"
          if [ "$actual" -gt "$max_mb" ]; then
            echo "::error::compressed image is ${actual} MB > ceiling ${max_mb} MB (PRD-001 §8)"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact Nix OCI image for this architecture
        env:
          SOURCE_SHA: ${{ github.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ARCH_TAG="ghcr.io/dreamlab-ai/agentbox:${SOURCE_SHA}-${ARCH}"
          # The nix transport preserves the evidence's exact layer bytes. A
          # Docker daemon round-trip can recompress layers or rewrite config.
          "$IMAGE_COPIER/bin/copy-to" "docker://$ARCH_TAG" --authfile "$HOME/.docker/config.json" --digestfile registry-digest.txt
          digest=$(cat registry-digest.txt)
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          "$SECURITY_TOOLS/bin/skopeo" inspect --raw "docker://${ARCH_TAG%:*}@$digest" > registry-manifest.json
          "$SECURITY_TOOLS/bin/skopeo" inspect --config --raw "docker://${ARCH_TAG%:*}@$digest" > registry-config.json
          "$SECURITY_TOOLS/bin/agentbox-vex" check-image --bundle security-build --manifest registry-manifest.json --config registry-config.json --subject "$digest"
          "$SECURITY_TOOLS/bin/agentbox-vex" bind --bundle security-build --subject "$digest" --output security-published --manifest registry-manifest.json --config registry-config.json
          cp security-build/sbom.nix.spdx.json security-build/sbom.nix.csv security-published/
          printf '%s@%s\n' "${ARCH_TAG%:*}" "$digest" > security-published/image-ref.txt
          jq -n --arg sha "$SOURCE_SHA" --arg arch "$ARCH" --arg ref "${ARCH_TAG%:*}@$digest" --arg run "$GITHUB_RUN_ID" \
            '{source_revision:$sha,arch:$arch,image_ref:$ref,build_run_id:$run}' > security-published/publication.json

      - name: Upload digest-bound build SBOM and VEX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-build-${{ github.sha }}-${{ matrix.arch }}
          path: security-published/
          retention-days: 90

  manifest:
    name: Assemble and push multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push SHA manifest
        run: |
          AMD64="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}-amd64"
          ARM64="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}-arm64"
          SHA_TAG="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}"

          docker manifest create "${SHA_TAG}" \
            --amend "${AMD64}" \
            --amend "${ARM64}"
          docker manifest push "${SHA_TAG}"

      - name: Create and push :latest manifest (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          AMD64="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}-amd64"
          ARM64="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}-arm64"
          LATEST="ghcr.io/dreamlab-ai/agentbox:latest"

          docker manifest create "${LATEST}" \
            --amend "${AMD64}" \
            --amend "${ARM64}"
          docker manifest push "${LATEST}"

      - name: Create and push release tag manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          AMD64="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}-amd64"
          ARM64="ghcr.io/dreamlab-ai/agentbox:${{ github.sha }}-arm64"
          RELEASE_TAG="ghcr.io/dreamlab-ai/agentbox:${{ github.ref_name }}"

          docker manifest create "${RELEASE_TAG}" \
            --amend "${AMD64}" \
            --amend "${ARM64}"
          docker manifest push "${RELEASE_TAG}"
