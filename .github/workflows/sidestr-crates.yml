name: sidestr crates

on:
  pull_request:
    paths:
      - 'crates/sidestr/**'
      - '.github/workflows/sidestr-crates.yml'
  push:
    branches:
      - main
    paths:
      - 'crates/sidestr/**'

jobs:
  sidestr-tests:
    name: cargo test — crates/sidestr
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: crates/sidestr

      - name: Format
        run: cargo fmt --manifest-path crates/sidestr/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path crates/sidestr/Cargo.toml --all-targets -- -D warnings

      # The ported siding suites (claims, pegouts, stock header, per-rule
      # accept/refuse) plus the sealed fixtures: the trial genesis rebuilt byte
      # for byte and the estate's dreamlab genesis replayed. The JS interop
      # test skips itself without the reference checkouts.
      - name: Test
        run: cargo test --manifest-path crates/sidestr/Cargo.toml

      # sidestr-round's relay client, relay stand-in and `cosign` sit behind
      # features; build and unit-test them too. The mixed Rust/JS interop
      # scenarios (three signers on one box) skip themselves without the
      # reference checkouts, as the core interop test does.
      - name: Test sidestr-round with every feature
        run: cargo test --manifest-path crates/sidestr/Cargo.toml -p sidestr-round --all-features

      # AGPL crates ship full rustdoc (ADR-2106).
      - name: Docs
        run: cargo doc --manifest-path crates/sidestr/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
