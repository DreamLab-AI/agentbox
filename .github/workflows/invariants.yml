name: Security Invariants

# Executable-invariant CI guards for the 2026 hardening sprint. Each check under
# scripts/ci/ asserts a property the sprint established and exits non-zero on
# regression. check-no-npx-latest is a ratchet (fails only above baseline).
on:
  push:
    paths:
      - 'docker-compose*.yml'
      - 'docs/adr/**'
      - 'docs/PROTOCOL-registry.md'
      - 'config/seccomp-agentbox.json'
      - 'config/entrypoint-unified.sh'
      - 'management-api/**'
      - 'lib/**'
      - 'scripts/**'
      # The gates' own unit tests run in this job, so a change to one of them must
      # re-run it. Without this, tests/security/check-listeners.test.mjs could be
      # edited on main and the listener rule never re-asserted on that push.
      - 'tests/security/**'
      - 'tests/config/protocol-registry-lint.test.mjs'
      - 'tests/config/declared-vs-running.test.js'
      - 'tests/config/fixtures/runtime-state.json'
      - 'flake.nix'
      - 'skills/**'
      - 'mcp/**'
      - 'schema/**'
      - 'setup/agentbox.default.toml'
      - 'agentbox.toml'
      - '.github/workflows/invariants.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — ADR staleness gate diffs old commits)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Make check scripts executable
        run: chmod +x scripts/ci/*.sh

      - name: check-seccomp (high-value syscall denials intact)
        run: sh scripts/ci/check-seccomp.sh

      - name: check-nnp (no-new-privileges; no SETUID/SETGID cap_add)
        run: sh scripts/ci/check-nnp.sh

      - name: check-ports-loopback (loopback except ADR-045 NIP-98 ingress)
        run: sh scripts/ci/check-ports-loopback.sh

      - name: check-listeners unit tests (ADR-2062 — supervisor bind-address listener rule)
        run: node --test tests/security/check-listeners.test.mjs

      - name: aoe-launch-never-attaches (2026-10-01 — aoe pin past the non-tty attach fix; no attached launch in our tooling)
        run: node --test tests/cli/aoe-launch-never-attaches-from-scripts.test.mjs

      - name: check-db-password (no :-ruvector default)
        run: sh scripts/ci/check-db-password.sh

      - name: check-secret-not-in-env (AGENTBOX_BRIDGE_SK scrubbed before exec)
        run: sh scripts/ci/check-secret-not-in-env.sh

      # Custody X-1 step 1, W2 (bypass 3): every env var name the boot path and
      # the role-secret consumers read is classified ROLE / DEVUSER_CLASS /
      # NON_SECRET (config/custody/env-classes.json); ROLE vars leave PID 1's
      # environment under [security].role_isolation and are read by file.
      - name: env-secret-inventory (custody W2 — every env name classified; names only)
        run: node scripts/ci/env-secret-inventory.js --check
      - name: env-secret-inventory unit tests (custody W2; the loader and consumers run in contract-tests)
        run: node --test tests/security/env-secret-inventory.node-test.js
      - name: RC-X1-06 role-secret scrub contract (custody W2; no Docker needed)
        run: bash tests/runtime-contract/RC-X1-06.sh

      - name: check-single-metrics (exactly one collectDefaultMetrics call)
        run: node scripts/ci/check-single-metrics.js

      - name: check-no-npx-latest (ratchet — fails only above baseline)
        run: sh scripts/ci/check-no-npx-latest.sh

      - name: lint-skills (skill estate structure gate — required before rebuild)
        run: bash skills/lint-skills.sh
      - name: skill-count-check (ADR-2056 — the single count authority; was RED and unwired 2026-09-09)
        run: node scripts/skill-count-check.js
      - name: routing-table freshness (generated from frontmatter; ADR-2021)
        run: node skills/gen-routing-table.mjs --check

      - name: deepsec-gate unit tests (ADR-2033 — Security gate exit-code/threshold/receipt contract)
        run: node --test skills/build-with-quality/scripts/deepsec-gate.test.mjs

      - name: research-gates unit tests (deep-research integrity gates — quote/citation/independence contract)
        run: node --test skills/deep-research/scripts/research-gates.test.mjs

      - name: check-manifest-catalogue (ADR-039 gate-path parity)
        run: node scripts/ci/check-manifest-catalogue.js

      # CY-A2: the manifest must not lie about what runs. CI has no runtime, so
      # it checks agentbox.toml against the committed, dated snapshot captured
      # on the box (`--capture`); on the box the same script reads the live
      # supervisor and docker state.
      - name: check-declared-vs-running (CY-A2 — declared state vs runtime snapshot)
        run: node scripts/ci/check-declared-vs-running.js --state tests/config/fixtures/runtime-state.json
      - name: check-declared-vs-running unit tests
        run: node --test tests/config/declared-vs-running.test.js

      - name: check-no-logseq-paths (ADR-2028 — [vault] is the only corpus path authority)
        run: sh scripts/ci/check-no-logseq-paths.sh

      # ADR-2025 / ADR-2085 governed this check but nothing ever ran it (found in the
      # 2026-09-16 script audit). The fixture's whole point is that agentbox and
      # VisionClaw assert the SAME table rather than two tables that happen to agree —
      # which an ungated check cannot deliver. The Rust half still runs in VisionClaw CI.
      - name: federation-fixture-check (ADR-2025 — cross-repo identifier contract, agentbox side)
        run: node scripts/ci/federation-fixture-check.mjs

      # ADR-2105 / ADR-2098 (amended 2026-10-02): every Nostr kind row in the
      # registry names its owner, no number sits in two rows, the agentbox band holds.
      - name: protocol-registry-lint (ADR-2105 — kind rows owned, no collisions)
        run: node scripts/ci/protocol-registry-lint.mjs
      - name: protocol-registry-lint unit tests
        run: node --test tests/config/protocol-registry-lint.test.mjs

      # vault-frontmatter unit tests removed by ADR-2107/ADR-2108 with the writer
      # they gated: the V2 frontmatter helper existed only for the ontology write
      # path (axiomAdd/propose), which is deleted. `vault validate` is the
      # successor contract check and runs against the corpus, not a helper.

      - name: validate-adr-ledger (frontmatter, supersession reciprocity, verified_commit staleness)
        run: node scripts/adr-index-gen.js docs/adr --check

      # ADR-2001: --check validates RECORDS and never looks at README.md, so the
      # ledger's own navigation surface could drift from the records it indexes
      # with no gate noticing. This step regenerates the table in memory and
      # compares it with the file: adding or editing a record without running
      # `node scripts/adr-index-gen.js docs/adr` now fails here.
      - name: check-adr-index (ADR-2001 — docs/adr/README.md matches the records on disk)
        run: node scripts/adr-index-gen.js docs/adr --check-index

      - name: adr-ratchet self-test (an ADR added already decided is not backlog)
        run: bash tests/config/adr-ratchet.test.sh

      - name: adr-ratchet (planning cycle 2026-09-21 — a new proposal must close a proposed one)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/adr-ratchet.sh docs/adr "${BASE:-0}" "${{ github.sha }}"

      - name: check-crate-licensing (ADR-2030 — services/ crates carry the texts they declare)
        run: sh scripts/ci/check-crate-licensing.sh
