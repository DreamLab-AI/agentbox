# release.yml
#
# Creates a requested GitHub Release after a successful matching-commit scan.
# Attach each architecture's build evidence, OpenVEX, SBOMs and scan results in
# its own archive. Missing/expired matching artefacts block publication.
# Automatic tag builds remain disabled; workflow_dispatch supports releases.

name: Release

on:
  workflow_run:
    workflows: ["Image scan and SBOM"]
    types: [completed]
    branches-ignore: ['**']  # only tag pushes trigger build-multi-arch on v* refs
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.1.0)'
        required: true

permissions:
  contents: write
  packages: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUEST_TAG: ${{ inputs.tag }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag=$REQUEST_TAG
          else
            # workflow_run head_branch for tag pushes is 'refs/tags/<tag>'
            tag=$TRIGGER_BRANCH
            tag="${tag#refs/tags/}"
          fi
          [[ $tag =~ ^v[0-9][a-zA-Z0-9._-]*$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Extract release body from CHANGELOG.md
        id: body
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # Strip leading 'v' to match [1.2.3] style CHANGELOG headers.
          version="${tag#v}"
          tmp=$(mktemp)
          awk -v v="$version" '
            BEGIN { inside = 0 }
            /^## \[/ {
              if ($0 ~ "\\[" v "\\]" || $0 ~ "\\[" v "]") { inside = 1; next }
              else if (inside) { exit }
            }
            inside { print }
          ' CHANGELOG.md > "$tmp"
          if [ ! -s "$tmp" ]; then
            echo "No CHANGELOG section found for $tag; falling back to auto-generated notes."
            echo "auto_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_generated=false" >> "$GITHUB_OUTPUT"
            {
              echo "body_path=$tmp"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Find successful scan containing both exact-commit architectures
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/image-scan.yml/runs?status=success&per_page=100" > scan-runs.json
          selected=
          while read -r run; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" > scan-artifacts.json
            if jq -e --arg amd "image-scan-$sha-amd64" --arg arm "image-scan-$sha-arm64" \
              '[.artifacts[] | select(.expired == false) | .name] | index($amd) != null and index($arm) != null' scan-artifacts.json > /dev/null; then
              selected=$run
              break
            fi
          done < <(jq -r '.workflow_runs[] | select(.conclusion == "success") | .id' scan-runs.json)
          test -n "$selected" || { echo "No successful scan with both architectures for $sha; run Image scan and SBOM for the matching build first." >&2; exit 1; }
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"

      - name: Download exact-commit scan artefacts from matching run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-scan-${{ steps.scan.outputs.sha }}-*
          run-id: ${{ steps.scan.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: false
          path: release-scans/

      - name: Validate source scope and package architecture-specific reports
        env:
          SOURCE_SHA: ${{ steps.scan.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir release-assets
          for arch in amd64 arm64; do
            name="image-scan-$SOURCE_SHA-$arch"
            dir="release-scans/$name"
            jq -e --arg sha "$SOURCE_SHA" --arg arch "$arch" '.source_revision == $sha and .arch == $arch' "$dir/security-build/publication.json"
            test "$(cat "$dir/security-scan/grype.exit-code.txt")" = 0
            test "$(cat "$dir/security-scan/image-ref.txt")" = "$(jq -r .image_ref "$dir/security-build/publication.json")"
            tar -czf "release-assets/agentbox-security-$arch.tar.gz" -C "$dir" .
          done

      - name: Prepare release notes footer
        id: footer
        run: |
          set -euo pipefail
          cat > release-footer.md <<EOF

          ## Container image

          Published to GitHub Container Registry:

          \`\`\`sh
          docker pull ghcr.io/dreamlab-ai/agentbox:${{ steps.tag.outputs.tag }}
          \`\`\`

          Multi-arch manifest with linux/amd64 and linux/arm64. Image scan
          report, Nix CycloneDX/SPDX SBOMs, OpenVEX and build evidence attached
          as separate architecture-specific release archives.

          ## Verify

          \`\`\`sh
          # Manifest digest
          docker buildx imagetools inspect \\
            ghcr.io/dreamlab-ai/agentbox:${{ steps.tag.outputs.tag }}

          # Boot probe (after docker compose up)
          curl -sf http://localhost:9090/ready | jq
          \`\`\`

          Full spec: [ADR-007](docs/reference/adr/ADR-007-runtime-contract-and-container-hardening.md).
          EOF

      - name: Compose final release notes
        run: |
          set -euo pipefail
          if [ "${{ steps.body.outputs.auto_generated }}" = "true" ]; then
            echo "Release ${{ steps.tag.outputs.tag }}" > release-notes.md
            echo "" >> release-notes.md
          else
            cat "${{ steps.body.outputs.body_path }}" > release-notes.md
          fi
          cat release-footer.md >> release-notes.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: agentbox ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            release-assets/*
          generate_release_notes: ${{ steps.body.outputs.auto_generated == 'true' }}
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-rc') }}
