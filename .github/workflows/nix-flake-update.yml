# Weekly `nix flake update` — bumps all Nix inputs (nixpkgs, flake-utils,
# nix2container, rust-overlay, skills). Opens a PR if flake.lock changed.
#
# Complements renovate.json, which handles npm / GitHub Actions / custom regex
# pins. This workflow is specifically for the Nix input graph.

name: nix-flake-update

on:
  schedule:
    # Mondays at 06:00 UTC — same rhythm as Renovate's default.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# contents: push the update branch. pull-requests: open the PR when a token is
# allowed to. issues: the honest fallback when none is — see the publish step.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nix-flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Full history: the publish step pushes a real commit, and a push from a
      # shallow clone is refused by the remote.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          # Relative path lock nodes require modern Nix; match the verified builder pin.
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Run flake update
        id: update
        run: |
          set -euo pipefail
          before=$(sha256sum flake.lock | cut -d' ' -f1)
          # Updating the lock does not commit unless --commit-lock-file is supplied.
          nix flake update
          after=$(sha256sum flake.lock | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            echo "no-changes=true" >> "$GITHUB_OUTPUT"
            echo "flake.lock unchanged; nothing to PR"
          else
            echo "no-changes=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock updated"
            git diff flake.lock | head -80 || true
          fi

      - name: Run flake check on updated inputs
        if: steps.update.outputs.no-changes == 'false'
        run: nix flake check --no-build --print-build-logs

      # Publishing used to be peter-evans/create-pull-request with GITHUB_TOKEN,
      # which failed every week with "GitHub Actions is not permitted to create or
      # approve pull requests": the org and the repo both have
      # can_approve_pull_request_reviews = false. That setting also governs
      # APPROVING pull requests, so turning it on to buy PR creation would let any
      # workflow self-approve a review — a worse trade than doing without.
      #
      # So the branch is the deliverable and it is always pushed with GITHUB_TOKEN
      # (contents: write is not restricted). A pull request is then opened if, and
      # only if, a token exists that may open one:
      #   NIX_FLAKE_UPDATE_TOKEN  — a PAT (or app token) with `repo` scope; set it
      #                             and the weekly run produces a real PR again.
      #   otherwise               — a tracking issue naming the branch, so the
      #                             update is visible rather than silently parked.
      # No labels are requested: this repository has only the default label set,
      # and the old `deps`/`nix` labels would have failed the call on their own.
      - name: Publish the update
        if: steps.update.outputs.no-changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.NIX_FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: deps/nix-flake-update
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "deps(nix): weekly flake input update

          Auto-generated by .github/workflows/nix-flake-update.yml.
          \`nix flake check --no-build\` passed on these inputs in the same run.

          Co-Authored-By: jjohare <github@thedreamlab.uk>"

          # The branch is bot-owned and regenerated from main every week, so a
          # non-fast-forward push is the intended behaviour, not a lost commit.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $BRANCH"

          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH; it now carries the fresh lock"
            exit 0
          fi

          body="$(cat <<'EOF'
          Weekly `nix flake update` run.

          ### What changed

          See the diff on `flake.lock` for per-input commit bumps.
          `nix flake check --no-build` passed on these inputs in the generating run.

          ### Pre-merge checklist

          - [ ] `nix build .#runtime` succeeds on x86_64-linux
          - [ ] `nix build .#runtime` succeeds on aarch64-linux
          - [ ] Contract-test harness green
          - [ ] No unexpected image-size jump (`docker images` diff)
          EOF
          )"

          if gh pr create --base main --head "$BRANCH" \
               --title "deps(nix): weekly flake input update" --body "$body"; then
            exit 0
          fi

          echo "::warning::Could not open a pull request. GITHUB_TOKEN may not create one while 'Allow GitHub Actions to create and approve pull requests' is off; set the NIX_FLAKE_UPDATE_TOKEN secret to restore PRs. Falling back to a tracking issue."

          issue_title="deps(nix): weekly flake input update ready on $BRANCH"
          open_issue="$(gh issue list --state open --search "$issue_title in:title" --json number --jq '.[0].number // empty')"
          issue_body="$(printf '%s\n' \
            "\`nix flake update\` produced a new \`flake.lock\` and \`nix flake check --no-build\` passed on it." \
            "" \
            "Branch: [\`$BRANCH\`](https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH) (force-updated each week)" \
            "Compare: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH" \
            "" \
            "No pull request could be opened automatically: this repository's Actions token is not permitted to create pull requests. Open the PR from the compare link, or set a \`NIX_FLAKE_UPDATE_TOKEN\` secret and the weekly run will do it." \
            "" \
            "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"

          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$issue_body"
          else
            gh issue create --title "$issue_title" --body "$issue_body"
          fi
