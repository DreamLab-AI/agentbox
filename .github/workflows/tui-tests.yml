name: TUI helper tests

on:
  pull_request:
    paths:
      - 'services/agentbox-manifest/**'
      - 'services/agentbox-sessions/**'
      - 'config/session-plane/**'
      - 'tests/cli/session-launch-contract.test.mjs'
      - 'tests/tui/**'
      - '.github/workflows/tui-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'services/agentbox-manifest/**'
      - 'services/agentbox-sessions/**'
      - 'config/session-plane/**'
      - 'tests/cli/session-launch-contract.test.mjs'
      - 'tests/tui/**'

jobs:
  manifest-tests:
    name: cargo test — agentbox-manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: services/agentbox-manifest

      # The schema-compatibility group shells out to
      # scripts/agentbox-config-validate.js. Without its npm deps the suite
      # detects the missing module and skips those assertions, so `npm ci` is
      # what keeps them live rather than silently green.
      - name: Set up Node 20 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node deps (for agentbox-config-validate.js)
        run: npm ci

      - name: Clippy
        run: cargo clippy --manifest-path services/agentbox-manifest/Cargo.toml --all-targets -- -D warnings

      # Covers the ported pytest suite (tests/tui_helpers.rs) plus the
      # byte-for-byte golden suites that pin parity with the retired Python.
      - name: Test
        run: cargo test --manifest-path services/agentbox-manifest/Cargo.toml

  sessions-tests:
    name: cargo test — agentbox-sessions (ADR-2153)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The integration tests drive real processes on a private `tmux -L` server,
      # so tmux must be present; a runner without it would fail loudly, not skip.
      - name: Ensure tmux and git are installed
        run: |
          command -v tmux >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq tmux; }
          tmux -V
          git --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: services/agentbox-sessions

      - name: Clippy
        run: cargo clippy --locked --manifest-path services/agentbox-sessions/Cargo.toml --all-targets -- -D warnings

      # Unit tests, plus tests/plane.rs: ownership marker, reconcile decisions,
      # the dirty-worktree gate on a real built worktree, restart backoff, the
      # SO_PEERCRED ACL and send. None of it touches the default tmux server.
      - name: Test
        run: cargo test --locked --manifest-path services/agentbox-sessions/Cargo.toml

      - name: Build the binary for the parity test
        run: cargo build --locked --manifest-path services/agentbox-sessions/Cargo.toml

      # Compares the daemon's resolution of every seed with the Node contract
      # test, field by field. Without the binary that case skips, so build it first.
      - name: Node/Rust launch-contract parity
        env:
          AGENTBOX_SESSIONS_BIN: ${{ github.workspace }}/services/agentbox-sessions/target/debug/agentbox-sessions
        run: node --test tests/cli/session-launch-contract.test.mjs
