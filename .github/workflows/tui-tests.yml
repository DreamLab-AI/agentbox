name: TUI helper tests

on:
  pull_request:
    paths:
      - 'services/agentbox-manifest/**'
      - 'tests/tui/**'
      - '.github/workflows/tui-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'services/agentbox-manifest/**'
      - 'tests/tui/**'

jobs:
  manifest-tests:
    name: cargo test — agentbox-manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/agentbox-manifest

      # The schema-compatibility group shells out to
      # scripts/agentbox-config-validate.js. Without its npm deps the suite
      # detects the missing module and skips those assertions, so `npm ci` is
      # what keeps them live rather than silently green.
      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node deps (for agentbox-config-validate.js)
        run: npm ci

      - name: Clippy
        run: cargo clippy --manifest-path services/agentbox-manifest/Cargo.toml --all-targets -- -D warnings

      # Covers the ported pytest suite (tests/tui_helpers.rs) plus the
      # byte-for-byte golden suites that pin parity with the retired Python.
      - name: Test
        run: cargo test --manifest-path services/agentbox-manifest/Cargo.toml
