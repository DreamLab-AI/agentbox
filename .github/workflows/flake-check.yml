# flake-check.yml
#
# Triggers: all pull_requests.
# Produces: `nix flake check --no-build` on both x86_64-linux and aarch64-linux,
#           catching Nix evaluation regressions (attribute errors, type errors,
#           assertion failures) before they land on main.
#
# --no-build means only the Nix expression is evaluated; no derivations are
# realised. This keeps the job under 5 minutes p95.

name: Nix flake check

on:
  pull_request:

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    name: Check ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up Cachix (pull)
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'dreamlab-ai' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run nix flake check (eval only)
        run: nix flake check --no-build --print-build-logs

      - name: Eval top-level outputs (catches regressions eval-only misses)
        run: |
          set -euo pipefail
          # .#runtime is the canonical build target (nix build .#runtime).
          # .#compose is a separate derivation; eval it separately so a missing
          # attribute surfaces here rather than silently in build-multi-arch.
          # Evaluation of .#compose also forces the E021 / audit_acknowledged
          # check (builtins.seq _w021Check ...) — a missing [security].audit_acknowledged
          # will throw at eval time and this step will fail loudly.
          nix eval --raw .#runtime.drvPath > /dev/null
          nix eval --raw .#compose.drvPath > /dev/null
          echo "OK: .#runtime and .#compose derivations resolve (E021 audit gate passed)"

      - name: Lint Nix files (statix)
        run: nix shell nixpkgs#statix -c statix check
