# manifest-validate.yml
#
# Runs the agentbox manifest validator on every PR that touches the manifest,
# the schema, the validator itself, or the TUI helpers. This is the same
# validator the TUI invokes on every section transition and the flake
# evaluator runs at build time (see scripts/agentbox-config-validate.js,
# ADR-005 §Validator, ADR-007 §4a).
#
# Also round-trips the manifest through the TUI read/write helpers so
# wizard edits preserve every manifest block (regression guard for the
# class of bugs where a new [section] gets silently dropped from the
# canonical output).

name: Manifest validate

on:
  pull_request:
    paths:
      - 'agentbox.toml'
      - 'schema/**'
      - 'scripts/agentbox-config-validate.*'
      - 'services/agentbox-manifest/**'
      - 'tests/config/**'
      - 'tests/tui/**'
      - 'config/sidechain/**'
      - 'config/role-accounts.json'
      - 'config/lib/**'
      - 'config/entrypoint-unified.sh'
      - 'scripts/dream-inbox.mjs'
      - 'management-api/lib/system-manifest.js'
      - '.github/workflows/manifest-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'agentbox.toml'
      - 'schema/**'
      - 'scripts/agentbox-config-validate.*'
      - 'services/agentbox-manifest/**'
      - 'tests/tui/**'
      - 'tests/config/sidechain-genesis.test.sh'
      - 'tests/config/sidechain-mirror-chain-event.test.sh'
      - 'tests/config/sidechain-producer-gates.test.sh'
      - 'tests/config/sidechain-mirror.test.cjs'
      - 'tests/config/dream-inbox-remind.test.cjs'
      - 'scripts/dream-inbox.mjs'
      - 'management-api/lib/system-manifest.js'
      - 'tests/config/knots_header_v2.py'
      - 'config/sidechain/**'
      - 'config/role-accounts.json'
      - 'config/lib/**'
      - 'config/entrypoint-unified.sh'
      - '.github/workflows/manifest-validate.yml'

concurrency:
  group: manifest-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: agentbox config validate + TUI round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 20 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: services/agentbox-manifest

      - name: Build agentbox-manifest
        run: cargo build --release --manifest-path services/agentbox-manifest/Cargo.toml

      - name: Install Node deps
        run: npm ci

      - name: Run validator against the shipped manifest
        run: node scripts/agentbox-config-validate.js agentbox.toml

      - name: Round-trip every test fixture through read+write+validate
        run: |
          set -euo pipefail
          MANIFEST_BIN=services/agentbox-manifest/target/release/agentbox-manifest
          for fixture in tests/tui/fixtures/valid-*.toml; do
            [ -f "$fixture" ] || continue
            echo "== round-trip $fixture =="
            state=$(mktemp --suffix=.json)
            out=$(mktemp --suffix=.toml)
            "$MANIFEST_BIN" tui-read  "$fixture" "$state"
            "$MANIFEST_BIN" tui-write "$state"   "$out"
            node scripts/agentbox-config-validate.js "$out"
            rm -f "$state" "$out"
          done

      - name: Assert invalid fixtures fail with the expected code
        run: |
          set -euo pipefail
          for invalid in tests/tui/fixtures/invalid-*.toml; do
            [ -f "$invalid" ] || continue
            code=$(basename "$invalid" .toml | sed 's/^invalid-//' | tr 'a-z' 'A-Z')
            echo "== $invalid must emit $code =="
            output=$(node scripts/agentbox-config-validate.js "$invalid" 2>&1 || true)
            if echo "$output" | grep -q "$code"; then
              echo "OK: $code surfaced"
            else
              echo "FAIL: expected $code in output from $invalid"
              echo "$output"
              exit 1
            fi
          done

      - name: Assert JSON Schema is well-formed
        run: python3 -c "import json; json.load(open('schema/agentbox.toml.schema.json'))"

      - name: The two supervisor configs cannot drift (ADR-2122)
        # Today's rendered config vs the isolated one derived from it: only the role
        # programs' user= and environment= lines differ; secret paths are per-role.
        run: bash tests/config/role-isolation-supervisor.test.sh
        env:
          AGENTBOX_MANIFEST_BIN: services/agentbox-manifest/target/release/agentbox-manifest

      - name: /run/secrets delivery builds the right owner/mode tree (ADR-2122)
        # The real plan against a scratch root; chown is a recording stub (no root in CI).
        run: bash tests/config/role-secrets-delivery.test.sh
        env:
          AGENTBOX_MANIFEST_BIN: services/agentbox-manifest/target/release/agentbox-manifest
      - name: at-rest custody migrate/revert and sidechain state seed (ADR-2122, design 3.2-3.4, W2b/W4)
        # The real registry rows against a scratch root; chown is a recording stub (no root in CI).
        run: bash tests/config/role-custody-migrate.test.sh
        env:
          AGENTBOX_MANIFEST_BIN: services/agentbox-manifest/target/release/agentbox-manifest

      - name: With [security].role_isolation off the boot is today's (ADR-2122)
        run: bash tests/config/role-isolation-boot.test.sh

      - name: Sealed chain documents are well-formed and gated (ADR-2103)
        # The block file is not in the repository, so the on-disk hash case skips here;
        # the document invariants, the P21 mainnet gate and the no-key-in-git check run.
        run: bash tests/config/sidechain-genesis.test.sh

      - name: The mirror serves chain-event.json when it exists (ADR-2098 amended 2026-10-02)
        # Throwaway git repositories and a synthetic event; no chain event is made or published.
        run: bash tests/config/sidechain-mirror-chain-event.test.sh

      - name: The producer refuses an unvouched parent and never implies an anchor (ADR-2103 D3, D3a; SC5)
        # A stub engine and a loopback stub parent; no chain process and no real node.
        run: bash tests/config/sidechain-producer-gates.test.sh

      - name: Sidechain catalogue gates and mirror retry (ADR-2103)
        # [sidechain].enabled dominates each [sidechain.<name>] table, which dominates its own
        # mirror and faucet; the mirror retries a failed push. Throwaway git repositories.
        run: node --test tests/config/sidechain-mirror.test.cjs

      - name: A standing reminder reaches the governance panel once (ADR-2115)
        # scripts/dream-inbox.mjs remind against a throwaway inbox.
        run: node --test tests/config/dream-inbox-remind.test.cjs

      - name: Assert all W-codes are routed to warnings (advisory, not fatal)
        run: |
          set -euo pipefail
          # W021 was renamed E021 on 2026-04-25 and is no longer a W-code at all.
          # All remaining W-codes must use warnings.push, never errors.push.
          if grep -E "code: 'W[0-9]+'" scripts/agentbox-config-validate.js | \
               grep -q "errors\.push"; then
            echo "FAIL: a W-code is wired to errors.push — W-codes must be advisory"
            grep -E "code: 'W[0-9]+'" scripts/agentbox-config-validate.js | \
              grep "errors\.push"
            exit 1
          fi
          echo "OK: all W-codes use warnings.push"

      - name: Assert E021 fires when exception block is missing (gate-failure test)
        run: |
          set -euo pipefail
          # tests/tui/fixtures/invalid-e021.toml enables solid-pod-rs adapter
          # but omits [security.exceptions.solid-pod-rs], which must produce E021.
          # The validator exits non-zero on this intentionally-invalid fixture,
          # so capture its output with `|| true` first (same pattern as the
          # "Assert invalid fixtures fail" step). Grepping the pipeline directly
          # under `set -o pipefail` would inherit the validator's expected
          # non-zero exit and spuriously fail even when E021 is emitted.
          output=$(node scripts/agentbox-config-validate.js \
            tests/tui/fixtures/invalid-e021.toml 2>&1 || true)
          if echo "$output" | grep -q "E021"; then
            echo "OK: E021 fired as expected"
          else
            echo "FAIL: E021 did not fire — W021 audit gate may be broken"
            echo "$output"
            exit 1
          fi
