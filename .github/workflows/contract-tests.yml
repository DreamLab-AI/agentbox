name: Contract tests

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'management-api/adapters/**'
      - 'management-api/package.json'
      - 'management-api/package-lock.json'
      - 'mcp/nostr-bridge/**'
      - 'scripts/opf-router.py'
      - 'tests/contract/**'
      - 'agentbox/schemas/adapter-contracts/**'
      - '.github/workflows/contract-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'management-api/adapters/**'
      - 'management-api/package.json'
      - 'management-api/package-lock.json'
      - 'mcp/nostr-bridge/**'
      - 'tests/contract/**'
      - '.github/workflows/contract-tests.yml'

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Adapter contract suites
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: management-api/package-lock.json

      - name: Install dependencies
        working-directory: management-api
        # Rebuild the better-sqlite3 native addon FROM SOURCE against the CI runner's
        # exact Node ABI. The npm-ci prebuilt binary is ABI-mismatched on this runner and
        # segfaults on load/use (chronic beads.contract SIGSEGV/require-error, red since
        # June). ubuntu-latest ships the build toolchain (python3/make/g++).
        run: |
          npm ci
          npm rebuild better-sqlite3 --build-from-source

      - name: Run contract test suites
        working-directory: management-api
        run: npx jest ../tests/contract/ --testPathPattern='\.contract\.spec\.js$' --ci --forceExit

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: management-api/coverage/
          retention-days: 14
