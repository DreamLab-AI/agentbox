name: Contract tests

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'management-api/adapters/**'
      - 'management-api/package.json'
      - 'management-api/package-lock.json'
      - 'mcp/nostr-bridge/**'
      - 'scripts/opf-router.py'
      - 'tests/contract/**'
      - 'management-api/lib/uris.js'
      - 'management-api/routes/chain.js'
      - 'management-api/routes/payments.js'
      - 'management-api/routes/uri-resolver.js'
      - 'schema/federation-kinds.json'
      - 'tests/sovereign/chain-info.node-test.js'
      - 'tests/sovereign/pod-sovereign-signer.node-test.js'
      - 'management-api/lib/pod-signer.js'
      - 'management-api/lib/agent-identity.js'
      - 'mcp/servers/nostr-bridge.js'
      - 'management-api/lib/pay402.js'
      - 'management-api/lib/sidestr-*.js'
      - 'management-api/middleware/spend-policy.js'
      - 'management-api/middleware/consumer-payer.js'
      - 'management-api/routes/chain-payments.js'
      - 'tests/sovereign/sidestr-spend-key.node-test.js'
      - 'tests/sovereign/chain-payments.node-test.js'
      - 'tests/sovereign/dispatch-as.node-test.js'
      - 'scripts/sidechain/**'
      - 'tests/sovereign/sidechain-health.node-test.js'
      - 'tests/sovereign/sidechain-witness.node-test.js'
      - 'management-api/lib/sidechain-health.js'
      - 'management-api/lib/system-manifest.js'
      - 'management-api/routes/system.js'
      - 'scripts/activation/sidechain-witness.cjs'
      - 'scripts/activation/sidechain-demo-witness.sh'
      - 'agentbox/schemas/adapter-contracts/**'
      - '.github/workflows/contract-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'management-api/adapters/**'
      - 'management-api/package.json'
      - 'management-api/package-lock.json'
      - 'mcp/nostr-bridge/**'
      - 'tests/contract/**'
      - 'management-api/lib/uris.js'
      - 'management-api/routes/chain.js'
      - 'management-api/routes/payments.js'
      - 'management-api/routes/uri-resolver.js'
      - 'schema/federation-kinds.json'
      - 'tests/sovereign/chain-info.node-test.js'
      - 'tests/sovereign/pod-sovereign-signer.node-test.js'
      - 'management-api/lib/pod-signer.js'
      - 'management-api/lib/agent-identity.js'
      - 'mcp/servers/nostr-bridge.js'
      - 'management-api/lib/pay402.js'
      - 'management-api/lib/sidestr-*.js'
      - 'management-api/middleware/spend-policy.js'
      - 'management-api/middleware/consumer-payer.js'
      - 'management-api/routes/chain-payments.js'
      - 'tests/sovereign/sidestr-spend-key.node-test.js'
      - 'tests/sovereign/chain-payments.node-test.js'
      - 'tests/sovereign/dispatch-as.node-test.js'
      - 'scripts/sidechain/**'
      - 'tests/sovereign/sidechain-health.node-test.js'
      - 'tests/sovereign/sidechain-witness.node-test.js'
      - 'management-api/lib/sidechain-health.js'
      - 'management-api/lib/system-manifest.js'
      - 'management-api/routes/system.js'
      - 'scripts/activation/sidechain-witness.cjs'
      - 'scripts/activation/sidechain-demo-witness.sh'
      - '.github/workflows/contract-tests.yml'

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Adapter contract suites
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 22 (matches the runtime image — nodejs_22 in flake.nix)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: management-api/package-lock.json

      - name: Install dependencies
        working-directory: management-api
        run: npm ci

      # tests/contract/*.spec.js resolve their own helpers (ajv, ajv-formats,
      # @iarna/toml) from the REPO-ROOT package.json, not management-api's;
      # without this step execution-journal.contract.spec.js fails with
      # "Cannot find module 'ajv'" (red since 2026-08-16).
      - name: Install repo-root test dependencies
        run: npm ci --ignore-scripts

      - name: Run contract test suites
        working-directory: management-api
        run: npx jest ../tests/contract/ --testPathPatterns='\.contract\.spec\.js$' --ci --forceExit

      # nostr-tools pulls ESM-only @noble packages jest cannot require, so the
      # chain identity route (ADR-2098 amended 2026-10-02) runs under node:test.
      - name: Chain identity route (/v1/chain/info, chain URNs)
        working-directory: management-api
        run: node --test ../tests/sovereign/chain-info.node-test.js

      # ADR-2078 acceptance: the pods adapter signs as the boot-minted sovereign
      # identity (real BIP-340 keys, verified by NostrBridge.verifyNip98). The
      # bridge resolves nostr-tools from mcp/, which CI does not install, so
      # NODE_PATH points it at management-api's copy (same pinned 2.25.2).
      - name: Pods signer — sovereign identity (ADR-2078)
        working-directory: management-api
        run: NODE_PATH="$PWD/node_modules" node --test ../tests/sovereign/pod-sovereign-signer.node-test.js

      # ADR-2097 (amended 2026-10-02): the sidestr rail — k_spend/k_id binding
      # known-answer test and the /v1/chain/pay pipeline, also under node:test.
      - name: sidestr rail (k_spend binding KAT, /v1/chain/pay, /v1/chain/payments)
        working-directory: management-api
        run: |
          node --test ../tests/sovereign/sidestr-spend-key.node-test.js ../tests/sovereign/chain-payments.node-test.js
          SIDESTR_TEST_CHAIN=dreamlab node --test ../tests/sovereign/chain-payments.node-test.js
          NODE_PATH="$PWD/node_modules" node --test ../tests/sovereign/dispatch-as.node-test.js

      # ADR-2103 interim receipt (amended 2026-10-02): the producer tip-age probe
      # and the demo witness. Their loopback-chain cases need the upstream siding
      # checkout and a built replay helper, absent here, and say so as skips.
      - name: Sidechain tip-age probe and demo witness
        working-directory: management-api
        run: node --test ../tests/sovereign/sidechain-health.node-test.js ../tests/sovereign/sidechain-witness.node-test.js

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contract-test-results
          path: management-api/coverage/
          retention-days: 14
