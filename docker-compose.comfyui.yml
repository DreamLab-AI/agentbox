# Standalone local GPU sidecar; shares the network used by agentbox, and joins
# visionclaw_network so the VisionClaw server reaches it as http://comfyui:8188
# (its image-gen handler default).
services:
  comfyui:
    build:
      context: .
      dockerfile: comfyui-sidecar/Dockerfile
    image: agentbox-comfyui:local
    container_name: comfyui
    restart: unless-stopped
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Runtime model provisioning only; never a Docker build argument.
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${COMFYUI_GPU_DEVICE:-0}']
              capabilities: [gpu]
    volumes:
      - comfyui-models:/opt/ComfyUI/models
      - comfyui-output:/opt/ComfyUI/output
      - comfyui-input:/opt/ComfyUI/input
      - comfyui-user:/opt/ComfyUI/user
    networks: [agentbox, visionclaw]
    ports: ['127.0.0.1:8188:8188']
    shm_size: 8gb
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8188/system_stats", timeout=5)']
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
  model-provision:
    # One-shot CPU download worker; no GPU reservation and no inference.
    # Independent of ComfyUI lifecycle so rebuilding the service retains transfers.
    profiles: [provision]
    image: agentbox-comfyui:local
    container_name: agentbox-media-provision
    restart: "no"
    entrypoint: [python, /opt/agentbox-media/scripts/download_video_models.py]
    command: [--campaign, "${COMFY_MODEL_CAMPAIGN:-core}", --models-dir, /opt/ComfyUI/models]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - comfyui-models:/opt/ComfyUI/models
    networks: [agentbox]
    cpus: 2
    mem_limit: 1g
networks:
  agentbox:
    external: true
    name: ${COMFYUI_NETWORK:-agentbox_default}
  visionclaw:
    external: true
    name: ${VISIONCLAW_NETWORK:-visionclaw_network}
volumes:
  comfyui-models:
  comfyui-output:
  comfyui-input:
  comfyui-user:
