# the connected node peer node overlay (2026-09-02). Used INSTEAD of
# docker-compose.override.yml (that file is the gateway host-specific: MAD
# workspace volume, /mnt/dell NFS, PROJECT_DIR_* binds, docker.sock).
#   docker compose -f docker-compose.yml -f docker-compose.hp.yml up -d
services:
  agentbox:
    hostname: agentbox-hp
    env_file:
      - .env
    environment:
      - RUVECTOR_PG_CONNINFO=host=ruvector-postgres port=5432 dbname=ruvector user=ruvector password=${RUVECTOR_PG_PASSWORD}
      - RUVECTOR_USE_EXTERNAL=true
      - RUVECTOR_PG_PASSWORD=${RUVECTOR_PG_PASSWORD}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - CUDA_VISIBLE_DEVICES=0,1
      - DISPLAY=:1
      - WLR_BACKENDS=headless
      - AGENTBOX_NODE_LABEL=hp-desktop
      # AGENTBOX_NSEC / AGENTBOX_PRIVKEY_HEX arrive by env_file (.env), never
      # here: ROLE-class (config/custody/env-classes.json; custody W10 2026-10-03).
      - COMFYUI_OUTPUTS=/run/comfyui/output
    volumes:
      # Legacy whole-directory bind: this node has not yet run
      # `./agentbox.sh migrate-claude-home` (ADR-2118). Until it does, the
      # entrypoint leaves the host's global CLAUDE.md alone (--no-global); to
      # migrate, swap this line for the agentbox-claude-home volume plus the
      # ${HOME}/.claude:/var/lib/agentbox/host-claude:rw credential bind, as in
      # docker-compose.override.yml.
      - ${HOME}/.claude:/home/devuser/.claude:rw
      - ${HOME}/.config/claude:/home/devuser/.config/claude:rw
    shm_size: '16gb'
    deploy:
      resources:
        limits:
          cpus: '40'
          memory: 160G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]
volumes:
  ruvector-pg-data:
    name: ruvector_postgres_data_hp
