[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

# ---- X stack ---------------------------------------------------------------
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/dbus.log
stderr_logfile=/var/log/dbus.err

[program:xvfb]
# Software-GLX framebuffer; VirtualGL provides the GPU render path on top of this.
command=Xvfb :2 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:x11vnc]
command=x11vnc -display :2 -forever -shared -nopw -rfbport 5905 -noxdamage
autostart=true
autorestart=true
priority=20
environment=DISPLAY=":2"
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

# ---- Blender + BlenderMCP (socket 9876) ------------------------------------
[program:blender]
command=/opt/gui-tools/launch-blender.sh
user=devuser
autostart=true
autorestart=true
priority=30
startsecs=15
environment=DISPLAY=":2",HOME="/home/devuser",XDG_RUNTIME_DIR="/tmp/xdg-runtime",__GLX_VENDOR_LIBRARY_NAME="nvidia",BLENDER_MCP_BIND="0.0.0.0",BLENDER_MCP_PORT="9876"
stdout_logfile=/var/log/blender.log
stderr_logfile=/var/log/blender.err

# ---- QGIS + QGIS MCP (socket 9877) -----------------------------------------
[program:qgis]
command=/opt/gui-tools/launch-qgis.sh
user=devuser
autostart=true
autorestart=true
priority=40
startsecs=15
environment=DISPLAY=":2",HOME="/home/devuser",XDG_RUNTIME_DIR="/tmp/xdg-runtime",__GLX_VENDOR_LIBRARY_NAME="nvidia",QGIS_MCP_BIND="0.0.0.0",QGIS_MCP_PORT="9877"
stdout_logfile=/var/log/qgis.log
stderr_logfile=/var/log/qgis.err
