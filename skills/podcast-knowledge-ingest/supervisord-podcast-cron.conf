# Podcast Knowledge Ingest — weekly cron via supercronic
# Add this block to /etc/supervisord.conf during Docker build.
#
# Requires supercronic (static binary, no crond daemon needed):
#   ADD https://github.com/aptible/supercronic/releases/download/v0.2.33/supercronic-linux-amd64 /usr/local/bin/supercronic
#   RUN chmod +x /usr/local/bin/supercronic
#
# The crontab file is at the path below (bind-mounted from project/).

[program:podcast-cron]
command=/usr/local/bin/supercronic -split-logs /home/devuser/workspace/project/agentbox/skills/podcast-knowledge-ingest/crontab
user=devuser
environment=HOME="/home/devuser",PYTHONPATH="/home/devuser/.local/lib/python3.12/site-packages"
autostart=true
autorestart=true
startsecs=0
priority=250
stdout_logfile=/var/log/podcast-cron.log
stderr_logfile=/var/log/podcast-cron.error.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
