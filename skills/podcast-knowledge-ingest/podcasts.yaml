podcasts:
  # The channel's handle is @AIDailyBrief. The old "@TheAIDailyBrief" has no
  # videos tab, which yt-dlp reports as an error; the listing used to swallow it
  # and log "No new episodes" every Monday from 25 Aug to 19 Oct 2026.
  - channel: "@AIDailyBrief"
    name: "AI Daily Brief"
    focus: "AI industry news, policy, models, companies"
    # ADR-2028: paths derive from the [vault] path authority. The podcast-ingest
    # binary (services/podcast-ingest, ingest::config::expandvars) expands these,
    # so relocating [vault].root in agentbox.toml relocates this skill's output
    # with no edit here.
    output_dir: "${VAULT_TRANSCRIPTS}"
    # The curated topic pages, READ-ONLY here: used only to resolve an
    # extracted topic to an existing page for the wikilinks on a ledger bullet.
    pages_dir: "${VAULT_PAGES}"
    # The WORKING vault root (flat layout, ADR-OM-007: pages sit at its root). Everything this pipeline writes lands under it:
    # evidence ledgers in <working_dir>/podcast-evidence/ as `type: Episode`
    # pages with `public: false` (always, owner 2026-09-22 14:00; only a human
    # publishes an Episode), and proposed new pages as non-public `Draft Concept`
    # pages. Nothing here reaches knowledge/ except through `vault propose`.
    #
    # `ontology_dir`, the pre-ADR-2107 key, is refused loudly by the ingest
    # binary: it named one directory the pipeline both read and wrote.
    #
    # ${VAULT_*} is expanded to a PATH by the ingest binary. No value in this
    # file is ever interpolated into a page body or frontmatter.
    working_dir: "${VAULT_WORKING_PAGES}"

settings:
  loom_url: "${LOOM_BASE_URL}"
  # A second façade to try when the primary does not answer. Optional: when
  # LOOM_FALLBACK_URL is unset the entry is dropped and there is no fallback.
  # (An address belongs in the environment, not in a published file.)
  loom_fallback_urls: ["${LOOM_FALLBACK_URL}"]
  loom_model: "qwen3.8-27b"
  max_assertions_per_episode: 15
  min_confidence: 0.4
  quality_threshold: 0.85
  # Uncapped 2026-08-25 after reviewing the first live-capped runs: 140 ledger
  # pages landed, 0 curated pages modified, idempotency verified.
  max_episodes_per_run: 15
  backlog_batch_size: 50
