podcasts:
  - channel: "@TheAIDailyBrief"
    name: "AI Daily Brief"
    focus: "AI industry news, policy, models, companies"
    # ADR-2028: paths derive from the [vault] path authority. ingest.py expands
    # these with os.path.expandvars, so relocating [vault].root in agentbox.toml
    # relocates this skill's output with no edit here.
    output_dir: "${VAULT_TRANSCRIPTS}"
    ontology_dir: "${VAULT_PAGES}"

settings:
  loom_url: "http://192.168.2.132:8084/v1"
  loom_fallback_urls: ["http://10.10.10.1:8084/v1"]
  loom_model: "qwen3.8-27b"
  max_assertions_per_episode: 15
  min_confidence: 0.4
  quality_threshold: 0.85
  # Uncapped 2026-08-25 after reviewing the first live-capped runs: 140 ledger
  # pages landed, 0 curated pages modified, idempotency verified.
  max_episodes_per_run: 15
  backlog_batch_size: 50
