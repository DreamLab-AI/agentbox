[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
; ADR-2207 D1: size from BROWSER_DISPLAY_SIZE (display-env.sh, default 1920x1080, 16:9 only).
command=/opt/browsercontainer/start-xvfb.sh
user=devuser
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
; ADR-2207 D1: minimal window manager. Maximises and undecorates every normal
; window, one desktop, no key or mouse bindings (openbox-rc.xml). Without it
; Chrome clamps one pixel under the screen and cannot go fullscreen.
command=openbox --config-file /opt/browsercontainer/openbox-rc.xml
user=devuser
autostart=true
autorestart=true
priority=15
startsecs=2
startretries=20
environment=DISPLAY=":2",HOME="/home/devuser",XDG_RUNTIME_DIR="/tmp/xdg-runtime",XDG_CACHE_HOME="/tmp/.cache"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :2 -forever -shared -nopw -rfbport 5903 -noxdamage
user=devuser
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chromium]
command=/opt/browsercontainer/launch-chromium.sh
user=devuser
autostart=true
autorestart=true
priority=25
startsecs=5
environment=DISPLAY=":2",HOME="/home/devuser",XDG_RUNTIME_DIR="/tmp/xdg-runtime",XDG_CACHE_HOME="/tmp/.cache",TREAT_AS_SECURE="%(ENV_TREAT_AS_SECURE)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:podkey-loader]
; W9: loads the pinned Podkey into branded Chrome over CDP, once per Chrome
; process (a reload would clear Podkey's session key). No-op on Chromium (loaded
; by --load-extension) or when the image has no Podkey. Never blocks Chrome.
command=node /opt/browsercontainer/podkey-ctl.js load --watch
user=devuser
autostart=true
autorestart=true
priority=27
startsecs=5
startretries=1000
environment=HOME="/home/devuser",CDP_PORT="9222",BROWSERCONTAINER_RUN_DIR="/tmp/browsercontainer"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cdp-proxy]
; ADR-2207 D3: DevTools by name. Rewrites Host to 127.0.0.1:9222 and the ws URLs
; back to the caller's host, and keeps Chrome's DNS-rebinding defence: only IP
; literals, localhost and CDP_PROXY_ALLOWED_HOSTS (default browsercontainer) pass.
command=node /opt/browsercontainer/cdp-proxy.js
user=devuser
autostart=true
autorestart=true
priority=26
startsecs=1
environment=CDP_PORT="9222",CDP_PROXY_PORT="9223"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mcp-server]
command=node /opt/browsercontainer/server.js
user=devuser
autostart=true
autorestart=true
priority=30
startsecs=5
directory=/opt/browsercontainer
environment=DISPLAY=":2",SIDECAR_TRANSPORT="sse",SIDECAR_PORT="8931",HOME="/home/devuser",XDG_CACHE_HOME="/tmp/.cache",XDG_RUNTIME_DIR="/tmp/xdg-runtime",CDP_PORT="9222"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
