timeout_ms = 120000

# ── Model routing (ADR-041) ────────────────────────────────────────────────────
# One per-activity Claude/Codex routing policy, many projections (pattern
# adapted from pacphi/agentic-kit ADR-0001; the mechanism itself is upstream:
# agentic-qe ≥3.13.1 agentOverrides (#568) + @claude-flow/codex dual-mode).
# The entrypoint reconciles the enabled projections every boot (apply: boot):
#   1. agentOverrides → workspace .agentic-qe/llm-config.json (sanitised by
#      aqe's own loader; never carries API keys)
#   2. AQE_LLM_PROVIDER + AQE_LLM_FALLBACK_CHAIN on the agentic-qe MCP env
#   3. dual_run: claude-flow-codex collaboration swarms — EXPERIMENTAL, off:
#      upstream pins CLAUDE_FLOW_DB_PATH to local SQLite (ruflo #2766), which
#      conflicts with the ADR-015 postgres memory mandate.
# Hosts are subscription-tier ($0 marginal): claude → claude-code provider,
# codex → codex provider (`codex exec`, [consultants.codex] auth home).
# Escalation rungs prefer the CROSS-VENDOR hop (same principle as the ADR-011
# model-diversity "anti-fox" seam / aqe qe-court vendor diversity).
[model_routing]
enabled = true
primary_host = "claude"           # which host leads; absence of the primary is a failure, of the alternate a warning
aqe_agent_overrides = true        # projection 1+2: materialise routes + provider env for the QE fleet
dual_run = false                  # projection 3: EXPERIMENTAL (ruflo #2766) — leave off until upstream unpins local sqlite
aqe_llm_provider = "claude-code"  # AQE_LLM_PROVIDER default for unrouted fleet work (subscription, $0)
aqe_fallback_chain = "claude-code,codex"  # ordered AQE_LLM_FALLBACK_CHAIN — cross-vendor before local

# activity = "host:model" with an optional " -> host:model" escalation rung.
# Defaults grounded in upstream @claude-flow/codex CollaborationTemplates
# (Claude: reasoning/review; Codex: execution); packaging/release are
# kit-originated gap-fills (agentic-kit ADR-0002), flagged as such.
# Models are SOFT defaults (last verified 2026-09-01) — tune per activity.
[model_routing.routes]
specification     = "claude:claude-sonnet-5"
architecture      = "claude:claude-fable-5-1"
design            = "claude:claude-opus-5"
implementation    = "codex:gpt-5.5 -> claude:claude-fable-5-1"
testing           = "codex:gpt-5.5 -> claude:claude-opus-5"
review            = "claude:claude-sonnet-5"
security-scan     = "codex:gpt-5.5"
security-analysis = "claude:claude-fable-5-1"
documentation     = "codex:gpt-5.5"
debugging         = "claude:claude-fable-5-1"
packaging         = "codex:gpt-5.5"          # kit-originated activity (no upstream template)
release           = "claude:claude-sonnet-5" # kit-originated activity (no upstream template)

# ── Privacy filter ──────────────────────────────────────────────────────────────
# Local PII redaction sidecar using openai/privacy-filter (1.5B MoE, Apache-2.0).
# See docs/reference/adr/ADR-008-privacy-filter-routing.md for the routing layer
# contract. Gated: the wizard only offers this when a GPU is detected or the
# host has ≥4 cores and ≥6 GB free RAM (CPU path needs all experts resident).
#
# mode: off            → sidecar disabled; adapter dispatch is a pass-through.
#       local-gpu      → HF transformers pipeline, BF16 on CUDA/ROCm.
#       local-cpu      → HF transformers pipeline on CPU (~3 GB BF16 weights).
#       local-clinical → route the clinical/PHI slots to the OpenMed sidecar
#                        (see [privacy_filter.openmed]); PII slots still use the
#                        base model above. Only honoured when the openmed block
#                        is enabled AND its prerequisites are acknowledged.
#
# Per-slot policy values:
#   "strict" → redact-before-persist; fail-closed if router unreachable.
#   "soft"   → redact best-effort; fail-open with counter.
#   "off"    → pass-through.
[privacy_filter]
enabled = true
mode = "local-cpu"
port = 9092
dtype = "bf16"
model = "openai/privacy-filter"
# openai/privacy-filter ships a custom architecture (model_type
# "openai_privacy_filter") that stock Transformers rejects with
# "does not recognize this architecture", leaving the PII filter unavailable
# (fail-open). The model carries its own modelling code on the Hub, so it must
# be loaded with trust_remote_code. Keep true while `model` is this checkpoint;
# set false only if you pin a Transformers-native token-classification model.
trust_remote_code = true

[privacy_filter.policy]
pods         = "strict"
memory       = "strict"
events       = "soft"
beads        = "soft"
orchestrator = "off"
inbound      = "soft"
outbound     = "soft"

[privacy_filter.entities]
# Empty list = redact all eight classes. Populate to restrict the set.
# Allowed: account_number, private_address, private_email, private_person,
#          private_phone, private_url, private_date, secret.
enabled = []

# ── OpenMed clinical-PHI redaction sidecar (optional, gated, DEFAULT OFF) ──────
# Layers a clinical/PHI redactor onto the ADR-008 privacy-filter seam, as the
# `local-clinical` backend above. OpenMed is an ONNX PHI-detection model
# (ruvnet/helix `helix-openmed` Rust policy + `helix-wasm` unicode-safe gates +
# an ONNX runtime). Runs as its own sidecar (docker-compose.openmed.yml /
# `./agentbox.sh openmed <up|down|health>`); the privacy filter calls it over
# the port below and applies redaction before persistence, reusing the existing
# `wrapWithPrivacyFilter` middleware — no new adapter slot, no new MCP tool.
#
# THREE PREREQUISITES gate activation (fail-closed — the boot probe refuses to
# start the sidecar unless all three are satisfied, mirroring the mainnet guard):
#   1. license_acknowledged  — helix is pre-release (v0.1.0) with an unresolved
#      LICENSE. Set true only after the operator has verified the licence permits
#      this use. Vendoring the model/code is blocked until then.
#   2. onnx_runtime_present   — no ONNX runtime is packaged in the image yet
#      (the same gap PRD-016 deferred for "Kompress ML"). The sidecar Dockerfile
#      provisions it; this flag records that it is available.
#   3. governance_acknowledged — a passing gate is NOT HIPAA Safe Harbor / Expert
#      Determination (OpenMed's own docs disclaim this). Set true only after the
#      operator has decided the compliance posture being claimed.
# The HMAC key OpenMed requires is derived via the existing ADR-029 child-key
# scheme (HMAC-SHA256(operator_sk, key_tag)) — no new secret store.
[privacy_filter.openmed]
enabled                 = false
port                    = 9093
# Content-addressed model artifact + SHA-256 lock, provisioned into the sidecar
# (never committed to this repo). Empty until the operator provisions them.
model_artifact          = ""
artifact_lock_sha256    = ""
hmac_key_tag            = "agentbox-openmed-v1"   # ADR-029 child-key derivation tag
# Fail-closed prerequisite gates (see comment above) — all must be true to run.
license_acknowledged    = false
onnx_runtime_present    = false
governance_acknowledged = false
# Which privacy-filter slots route to the clinical redactor when active.
[privacy_filter.openmed.policy]
pods    = "strict"
memory  = "strict"
inbound = "soft"
outbound = "soft"

# ── Linked-Data interchange (PRD-006 / ADR-012 / DDD-004) ──────────────────────
# Master gate for the eleven JSON-LD federation surfaces. Default off — a
# clone+up build sees zero behavioural change. Each per-surface gate accepts
# on | emit | off; rules E040–E049 enforce coherence.
#
# Phase 1 (mechanism only): architecture_docs, skill_metadata.
# Phase 2 (sovereign-stack): pods, events, did_documents, provenance.
# Phase 3 (credentials):     credentials, payments, capability_descriptors,
#                            memory_catalogue, http_meta.
[linked_data]
enabled                = true
pods                   = "on"    # S1  Solid pod resource representations
events                 = "on"    # S2  Nostr envelope payloads
credentials            = "emit"  # S3  W3C Verifiable Credentials
did_documents          = "emit"  # S4  DID Documents at /.well-known/did.json
provenance             = "emit"  # S5  PROV-O receipts (parallel to events)
capability_descriptors = "emit"  # S6  W3C WoT Thing Descriptions for MCP
skill_metadata         = "emit"  # S7  Schema.org HowTo (build-time)
payments               = "on"    # S8  Mandates + receipts (VC + ODRL)
memory_catalogue       = "emit"  # S9  DCAT-3 namespace catalogue
architecture_docs      = "emit"  # S10 ADR/PRD/DDD frame frontmatter (build-time)
http_meta              = "emit"  # S11 Content-negotiated /v1/meta + /v1/agent-events
default_form           = "compacted"
context_catalogue      = "/opt/agentbox/contexts"
context_cache_mode     = "image"        # image | bind | off (E046)
unknown_context_policy = "fail-closed"  # fail-closed | fail-open (W047)
canonicalisation       = "jcs"          # jcs required for credentials/payments (E043)
round_trip_in_dispatch = true           # CI canary; turn off for hot paths

[linked_data.contexts]
# Operator overrides for context IRIs. Each value MUST resolve to a pinned
# ContextDocument in lib/linked-data-contexts.nix (E045). Leave empty for
# the catalogue defaults.

[linked_data.did]
method                = "nostr"
service_endpoints     = ["pod", "relay"]
publish_to_well_known = true

# ── Payment System ────────────────────────────────────────────────────────────
# HTTP 402 Web Ledger integration via solid-pod-rs.
# All costs in satoshis. Token operations use DREAM at configurable rate.
[payments]
enabled = true
backend = "solid-pod-rs"                    # proxy to local pod on :8484
base_cost_sats = 10
dream_per_sat = 10
hold_buffer_ratio = 1.2

[payments.tiers]
inference = 10        # text LLM: 10x base
image_gen = 100       # diffusion: 100x base
analytics = 5         # embeddings: 5x base

[payments.token]
ticker = "DREAM"
rate = 10             # DREAM per sat
supply = 1000000
issuer = ""           # populated from OPERATOR_NOSTR_PUBKEY at runtime

# PRD-015 Phase 1 — consumer & broadcast economy
[payments.consumer]
enabled                 = false          # opt-in; enable to allow governed outbound spends
max_sats_per_call       = 100
daily_budget_sats       = 1000
approval_threshold_sats = 50             # above this, spend parks pending ACSP approval
allow_origins           = []             # empty = mesh-only (pods + peer nodes)
deny_origins            = []
external_router         = "off"          # "off" | "cinderwright" (C9; custody warning)

[payments.broadcast]
enabled       = false
well_known    = false                    # serve /.well-known/x402.json (B1)
accepts_block = true                     # emit accepts[] in 402 challenges (B2)
health_signals = false
index_submit  = "off"

[skills.payment_router]
enabled = false                          # C5 — enable with [payments.consumer].enabled = true

[linked_data.privacy_handoff]
order = "after"   # documentation only — the order is fixed in code (E048)

# Linked-Object Viewer slot (S12 — PRD-006 §15 / ADR-013).
# A JSON-LD-aware browser at /lo/* that renders every PRD-006 surface.
# Default off — turning it on materialises linkedobjects/browser into
# the image at /opt/agentbox/browser/. Pane manifest at /lo/manifest.json.
# Validation rules: E050-E054, W053.
[linked_data.viewer]
mode                 = "local-linkedobjects"     # off | local-linkedobjects | external
mount_path           = "/lo"
bundle_path          = "/opt/agentbox/browser"
external_url         = ""
sri_hash             = ""
expose_port          = true
extra_panes          = []
upstream_panes_visible = true
source_code_header   = ""        # default = upstream repo URL (AGPL §13)

# ── Project tracking (PRD-017 / ADR-035 / DDD-015) ────────────────────────────
# Helm-grade project tracking (status grid, 30-day commit activity, AI
# primers/synopses, GitHub + local repo sync) re-expressed on the sovereign
# substrate. Every tracked workspace/host-mount git repo becomes a first-class
# `urn:agentbox:thing:<pubkey>:project-<sha>` (minted via management-api/lib/uris.js,
# no new URN kind); each scan is observable on the existing port-bound /metrics as
# the agentbox_project_* gauges (no new port — ADR-035 §D2); and, when nostr_publish
# is on, per-project status is signed as an addressable kind-30841 digest to the
# operator's did:nostr (sibling of the kind-30840 session summary — ADR-035 §D3).
#
# Disabled by default: when enabled=false the /v1/projects route returns 503 and
# no scan, metric, or nostr publish runs. Durable state rides the EXISTING adapter
# slots (memory for primers, events for scans) — never a new slot (ADR-035 §D4).
# Primers and github_enrichment are the only external hops and are independently
# gated (a Z.AI/GLM key and GITHUB_TOKEN respectively).
[project_tracking]
enabled             = true                                           # master gate; /v1/projects → 503 when off
scan_dirs           = ["/projects", "/home/devuser/workspace/project"]  # one-level-deep git-repo discovery roots
scan_interval_hours = 6                                              # periodic re-scan; 0 = on-demand only (no scheduler)
github_enrichment   = true                                          # pull open issues + stars via GITHUB_TOKEN (one external hop) — enabled 2026-07-22: token validated live (HTTP 200) and present in runtime env + .env (0600); E-2 cleared. Boot apply-class (ADR-039).
primer_model        = "glm-5.3"                                     # Z.AI/GLM model for primers/synopses (→ consultant, ADR-011)
primer_on_scan      = false                                         # auto-generate primers for new projects during a scan
nostr_publish       = true                                          # publish kind-30841 digests to the operator's did:nostr
metrics             = true                                          # emit the agentbox_project_* gauges on the port-bound /metrics

# ── Interaction plane — Agent of Empires (PRD-021 / ADR-042/043/044) ──────────
# AoE is the canonical interaction plane: `aoe serve` creates, monitors, attaches,
# and reviews interactive agent sessions, superseding the hand-rolled MAD tmux
# harness (PRD-013 / ADR-025). Adopted as an OVERLAY — a pinned flake input
# (flake.nix inputs.aoe), a supervised daemon, a NIP-98 reverse proxy, and the
# declarative session seeds below — with ZERO patches to the AoE crate (ADR-042 D2).
#
# The daemon binary is REBUILD-class (flake input → Nix image composition); the
# daemon + config + session seeds are BOOT-class (reconciled by the entrypoint every
# boot). With enabled = false the daemon never starts and no seeds are provisioned.
#
# Identity binding (ADR-043): each session seed derives a distinct did:nostr
# (AGENTBOX_PROFILE=<slug> → agent-identity.js loadOrMint), a session URN
# (urn:agentbox:activity:<scope>:session-<sha256-12> via uris.js), a beads epic,
# and a scoped memory namespace user:<pubkey>:proj:<repo>:<ns> at create time.
[interaction_plane]
enabled     = true                  # master gate; false ⇒ no daemon, no seeds (apply-class boot)
port        = 9095                  # aoe serve bind (127.0.0.1, --auth token behind proxy); NOT 8080 (code-server) / 7777 (relay)
dashboard   = "on"                  # aoe serve web dashboard (absorbs the never-deployed PRD-012 setup/ops dashboard)
proxy_auth  = "nip98"               # sole-ingress reverse proxy verifies NIP-98 → session pubkey (WS4 / ADR-043 D4.6)
proxy_port  = 9096                  # nip98-proxy listen port — the sole IDENTITY ingress to :9095 (N-05); free (adjacent to mgmt-api 9090)
# N-05 (revised): loopback is NO LONGER the boundary for :9095. aoe serve runs
# `--auth token`, so every request to :9095 must carry the daemon's shared-secret
# token (minted at launch into ~/.config/agent-of-empires/serve.url). The nip98-proxy
# (:9096) is still the only IDENTITY ingress — it verifies NIP-98 then injects the
# token upstream; the break-glass nostr-gateway reads the same token file. A
# co-resident process that cannot read that owner-only (0700) file can no longer
# drive the daemon merely because the port is loopback-reachable. Residual limit:
# processes running as the SAME devuser can still read the token file — the token
# raises the bar (no free loopback access) but does not isolate same-uid peers;
# per-process isolation remains future work.

# ── Unified operator auth (ADR-069: dreamlab-ai auth adoption) ──────────────
# The nip98-proxy is the ONE authenticator for every operator surface on the
# :8444 console origin. Projected every boot into
# workspace/.agentbox/nip98-proxy-config.json (boot apply class, no rebuild).
# allowed_pubkeys activates the npub gate (ADR-045 D2) — the dreamlab identity
# roster's operator key. Empty list = any validly-signed key (NOT recommended).
[interaction_plane.proxy]
allowed_pubkeys = [
  "6407eed80e2a8646e41a5ddba0ae6619425fc54af40e2b30482b9623c682425a",  # operator-jjohare (dreamlab roster)
  "b41654017f6850b13857d19d8ae0e3f88f1365600cab0321e8101c9e92682f7a",  # visionclaw-server governance publisher / active NIP-07 signer
  "11ed64225dd5e2c5e18f61ad43d5ad9272d08739d3a20dd25886197b0738663c",  # agentbox sovereign / house key (browsercontainer Podkey vault)
]

# Routes beyond the default AoE upstream. bearer_env names an env var whose
# value replaces the browser credential upstream (credential exchange at the
# trust boundary — the browser NEVER holds BRIDGE_TOKEN).
[[interaction_plane.proxy.routes]]
prefix = "/approvals"
target = "http://127.0.0.1:9090"
bearer_env = "MANAGEMENT_API_KEY"   # session-cookie reads; signed NIP-98 passes through (governance gates need the signature)

[[interaction_plane.proxy.routes]]
prefix = "/bridge"
target = "http://127.0.0.1:8971"
bearer_env = "BRIDGE_TOKEN"

[[interaction_plane.proxy.routes]]
prefix = "/dream"
target = "http://127.0.0.1:9090"
strip  = false
bearer_env = "MANAGEMENT_API_KEY"

[[interaction_plane.proxy.routes]]
prefix = "/mgmt"
target = "http://127.0.0.1:9090"
bearer_env = "MANAGEMENT_API_KEY"

[[interaction_plane.proxy.routes]]
prefix = "/feed"
target = "http://127.0.0.1:8971"
strip  = false
bearer_env = "BRIDGE_TOKEN"

# Declarative sessions replacing tmux-autostart harness windows 8–14 (WS2). Each
# seed becomes an AoE session under SESSION_PREFIX aoe_. eager_mandate defaults
# false (mandates are lazy, minted on first pod write — ADR-043 D4.5); flip true
# only for known pod-writers. Perplexity has NO seed — retired to MCP (F2-6).
[[interaction_plane.session_seeds]]
slug          = "codex"               # native ACP agent (was tab 14)
tool          = "codex"
worktree      = true
eager_mandate = false

[[interaction_plane.session_seeds]]
slug          = "antigravity"         # native AoE antigravity agent (was tab 10); model aligned to gemini-3.5-flash (F2-8)
tool          = "antigravity"         # @google/gemini-cli is SUNSET (2026-06-18); flake pins the Antigravity CLI (binary agy, lib/antigravity-cli.nix — NOT nixpkgs antigravity, which is the IDE); agy state lives in ~/.gemini (tmpfs)
worktree      = true
eager_mandate = false

[[interaction_plane.session_seeds]]
slug          = "openrouter"          # claude binary redirected (was tab 8) — env_allowlist is load-bearing (F2-4, N-01)
tool          = "claude"
worktree      = false
env_allowlist = ["ANTHROPIC_BASE_URL", "ANTHROPIC_AUTH_TOKEN"]
eager_mandate = false

[[interaction_plane.session_seeds]]
slug          = "zai"                 # claude → api.z.ai/api/anthropic (was tab 9); same allowlist guard
tool          = "claude"
worktree      = false
env_allowlist = ["ANTHROPIC_BASE_URL", "ANTHROPIC_AUTH_TOKEN"]
eager_mandate = false

[[interaction_plane.session_seeds]]
slug          = "deepseek"            # AoE first-class OpenCode connector → DeepSeek Responses API
tool          = "opencode"
model         = "deepseek-agent/deepseek-chat"
worktree      = true
eager_mandate = false

[[interaction_plane.session_seeds]]
slug          = "loom"                # AoE first-class OpenCode connector → Loom façade (scaffolded, for knowledge work)
tool          = "opencode"
model         = "loom-lan/qwen3.8-27B"
worktree      = true
eager_mandate = false

[[interaction_plane.session_seeds]]
slug          = "loom-raw"            # Raw Qwen via :8085 — no Loom scaffold, for coding tasks
tool          = "opencode"
model         = "loom-raw/qwen3.8-27B"
worktree      = true
eager_mandate = false

# tab-0 coordinator: named, special, TERMINAL VIEW. AoE's default ACP structured
# view has no tmux pane, so POST /send returns 400 acp_mode_unsupported (F5-3);
# terminal view is required for the voice send-keys / /send path (ADR-044).
[interaction_plane.coordinator]
slug          = "tab0"
tool          = "claude"
view          = "terminal"
eager_mandate = false

# ── Voice + AoE operator console (ADR-044) ───────────────────────────────────
# Documentation-as-data for the voice plane. This is a SIDECAR with its own
# lifecycle (./agentbox.sh voice up|down|...), NOT part of ./agentbox.sh up —
# so `enabled` here is descriptive state for /v1/system, not a boot gate. The
# caddy console (docker-compose.voice.yml) plus the external Kyutai Unmute
# speech stack (voice-stack/unmute clone, layered via voice/unmute-override.yml)
# give one same-origin operator cockpit unifying the voice loop and the AoE
# session board. See agentbox/voice/README.md.
[voice]
enabled              = false            # sidecar state (apply-class: sidecar — its own lifecycle, not `agentbox up`)
console_port         = 8444             # operator cockpit origin (self-signed TLS; mic secure-context)
debug_port           = 8443             # stock Unmute demo UI (diagnostics only)
unmute_build_context = "../voice-stack/unmute"  # external Kyutai fork clone (26 GB, not vendored); override VOICE_UNMUTE_DIR

[toolchains]
claude = true
claude_code = true
ruflo = true
claude_flow = true  # legacy alias gate: claude-flow IS ruflo (upstream rename, github.com/ruvnet/ruflo) — either gate bakes the ONE consolidated closure, which ships `ruflo` + `claude-flow` + `claude-flow-mcp` bins
agentic_qe = true
metaharness = true  # ADR-064: bakes metaharness@0.3.2 + @metaharness/darwin@0.8.3 CLIs (the versions the ruflo-metaharness plugin pins); pin discipline per ADR-067
nagual_qe = false  # disabled: upstream sqlx 0.9 SqlSafeStr compilation error
codebase_memory = true  # MCP-2 (2026-07-22): binary IS baked (codebase-memory-mcp on PATH); the boot MCP-registry projector now registers it, so the CLAUDE.md "USE FIRST" mandate is truthful next rebuild — gate kept ON (not flipped)
rust = true
antigravity_cli = true
codex = true
opencode = true
code_server = true
cuda = true

# ── Plugins (ruflo/claude-flow plugin system) ────────────────────────────────
# Plugins are installed into $HOME/.claude-flow/plugins/ at container boot
# (entrypoint Phase 7) and loaded by the MCP server at runtime.
# The Nix-packaged claude-flow/ruflo binaries provide the plugin CLI;
# npx @latest aliases are no longer needed.
#
# Plugin provenance legend (best-guess — please clarify where marked ??):
#   first-party (ruflo upstream, github.com/ruvnet/ruflo/plugins/):
#     ruflo-core, ruflo-intelligence, ruflo-swarm, ruflo-workflows,
#     ruflo-autopilot, ruflo-loop-workers, ruflo-agentdb, ruflo-ruvector,
#     ruflo-rag-memory, ruflo-knowledge-graph, ruflo-sparc, ruflo-testgen,
#     ruflo-goals, ruflo-docs, ruflo-adr, ruflo-ddd, ruflo-security-audit,
#     ruflo-aidefence, ruflo-observability, ruflo-browser, ruflo-wasm,
#     ruflo-federation, ruflo-migrations, ruflo-ruvllm, ruflo-plugin-creator,
#     ruflo-jujutsu (disabled — beads adapter is off), ruflo-cost-tracker
#   speculative / unconfirmed (not in any ADR or PRD; please clarify):
#     ruflo-daa    -- ?? purpose unknown; enabled by default
#     ruflo-rvf    -- ?? purpose unknown; enabled by default
#   disabled (domain-specific, opt-in):
#     ruflo-neural-trader, ruflo-market-data, ruflo-iot-cognitum
#   third-party registry (IPFS, source = "registry"):
#     @claude-flow/embeddings, @claude-flow/security, @claude-flow/neural
[plugins]
auto_update = false                     # off by default — set true for @latest
install_dir = "/home/devuser/.claude-flow/plugins"

# Memory backend for plugins that need persistence.
# Points to the same external ruvector-postgres used by integrations.ruvector_external.
# Password sourced from RUVECTOR_PG_PASSWORD env var (Q6) and substituted
# by the entrypoint when it materialises the claude-flow config.
[plugins.memory]
backend = "postgres"
conninfo = "postgresql://ruvector:@@RUVECTOR_PG_PASSWORD@@@ruvector-postgres:5432/ruvector"
fallback = "sqlite"
enable_hnsw = true

# Declared plugins — installed at boot, gated by enabled flag.
# source = "ruflo-git" (default): cloned from github.com/ruvnet/ruflo/plugins/
# source = "registry": installed from IPFS registry via `ruflo plugins install`

