# ── Code-as-Harness integration (PRD-008) ────────────────────────────────────
# Phase 1 (build-now): code-interpreter MCP + ExpeL extractor + ACI MCP
# Phase 2 (build-next): CodeAct skill + Voyager skill library + tree-search
# All gates default to safe minima. See PRD-008 §6 for phasing semantics.

[skills.code_interpreter]
# Persistent Python kernel as an MCP. Six tools: kernel.exec, list_vars,
# inspect, reset, interrupt, install_pkg. One kernel per Claude session,
# lazy spawn, idle watchdog. Wheelhouse-only package install (no PyPI).
enabled = true
idle_timeout_s = 1800          # 30 min; W044 warns if <300
max_memory_mb = 512            # RLIMIT_AS in MB
allow_pip_install = false      # if true, kernel.install_pkg works against pip_allowlist
# Wheels MUST be present in /var/lib/agentbox/code-interpreter-wheelhouse/.
# The Nix derivation bakes this list into the wheelhouse at image build.
pip_allowlist = [
  "numpy", "pandas", "scipy", "sympy", "matplotlib",
  "scikit-learn", "requests", "beautifulsoup4", "lxml",
  "networkx", "pydantic"
]

[skills.codeact]
# CodeAct skill — orchestrates the code-interpreter MCP for plan-execute-
# reflect loops. Depends on skills.code_interpreter.
enabled = true

[features.expel_lesson_extraction]
# Post-task experiential learning. Distils 0-N rules per completed
# trajectory into RuVector namespace code-harness-lessons as
# ex:DistilledLesson (memory_type=semantic, durable).
# See skills/expel-lesson-extractor/SKILL.md + ADR-019 §Mechanism 1.
enabled = true
max_lessons_per_task = 5       # cap on lessons extracted per trajectory; prevents noise flood
min_confidence = 0.6           # minimum confidence to store a lesson
confidence_floor = 0.3         # below this, lesson is auto-archived (ADR-019 §Garbage collection)
archive_after_days = 30        # lessons below floor demoted to *-archive after this many days
contradiction_sample_rate = 0.1  # 1/10 retrievals sampled for LLM-judge contradiction check

[skills.voyager_skill_library]
# Verified executable skill library. ex:VerifiedSkill records in
# code-harness-skills (memory_type=procedural). Three-gate VerificationGate.
# Phase 2 — depends on skills.code_interpreter + features.expel_lesson_extraction.
# See skills/voyager-skill-library/SKILL.md + ADR-019 §Mechanism 2.
# Validator: E044 (requires skills.code_interpreter.enabled = true).
enabled = true
max_skill_body_lines = 80      # reject candidates exceeding this line count
max_evidence_age_s = 3600      # verified_by trace URN must be younger than this
archive_after_days = 30        # non-max-version skills demoted to *-archive after N days

[skills.aci_shell]
# SWE-agent-style Agent-Computer Interface MCP. 5 tools (view/edit/
# search/test/submit). Phase 2 — off by default; opt-in only.
enabled = true
max_view_lines = 150           # hard cap per aci.view_file call
max_edit_context = 10          # max diff context lines in aci.edit_file response
test_command_allowlist = ["pytest", "cargo test", "npm test", "go test"]

[skills.ruvnet_brain]
# RuvNet Brain: source-grounded knowledge corpus for the RuvNet ecosystem
# (21+ repos: ruflo, ruvector, safla, agentdb, agentic-flow, sparc, etc).
# ~90k source chunks INGESTED INTO THE SHARED ruvector-postgres SIDECAR under
# the namespace below — embedded client-side via Xinference bge-small-en-v1.5
# (384-dim, ADR-015), the same embedding space and memory_entries table as all
# other agent memory. We deliberately do NOT run the upstream retrieval stack
# (@ruvector/rvf file stores + @xenova/transformers in-process embedder): the
# corpus is the value, the substrate is ours.
#
# Surfaces:
#  - search_ruvnet MCP tool (thin wrapper, mcp/ruvnet-brain/server.js):
#    namespace-scoped pgvector search + repo filter + passage formatting.
#  - mcp__claude-flow__memory_search({namespace: "ruvnet-kb"}): same data,
#    generic tool — no wrapper needed.
#  - Grounding hook on UserPromptSubmit: detects RuvNet mentions and
#    classical-substitute anti-patterns (pgvector-as-a-product, Pinecone,
#    LangChain, ...) and injects a search-first directive.
#
# Ingest playbook: scripts/ruvnet-brain-ingest.mjs — auto-runs at boot
# (backgrounded, after Xinference readiness) when auto_ingest = true; every
# boot reconciles against the latest upstream GitHub release (content-
# addressed chunks: only new/changed text is re-embedded, vanished chunks are
# pruned). Manual: ./agentbox.sh ruvnet-brain <ingest|status>.
# The namespace is appended to RUVECTOR_PROTECTED_NAMESPACES so agents cannot
# overwrite reference corpus rows through memory_store.
enabled = true
namespace = "ruvnet-kb"
auto_ingest = true                  # reconcile corpus at boot (backgrounded)
grounding_hook = true               # register UserPromptSubmit grounding hook
kb_release_url = "https://github.com/stuinfla/ruvnet-brain/releases/latest/download/ruvnet-brain.zip"
staging_path = "/var/lib/agentbox/ruvnet-brain"   # download/extract scratch (named volume)
embed_batch = 32                    # passages per Xinference /v1/embeddings call

[skills.tree_search_coder]
# Execution-gated tree-search. Generates N candidates, executes each
# in fresh kernel, scores by assertion pass. Slow path — explicitly
# invoked, never auto-routed. Phase 2 — off by default.
enabled = true
max_candidates = 5
per_branch_timeout_s = 60
spend_cap_usd = 0.50

[skills.ontology]
enabled = true
visionclaw_api_url = "http://visionclaw-server:4000"
# PRD-014 Seam D / D2: personal-KG concepts reach the shared ontology only
# through VisionClaw's GOVERNED path (ontology_propose → Whelk consistency →
# human approval → PR). The legacy ungoverned ontology_axiom_add backdoor
# (`POST /api/ontology/load`) is disabled by default; set true only for
# admin/bootstrap. Default off = ontology_axiom_add refuses + redirects.
direct_axiom_load = false

# Offline ontology condensation (PRD-020 WS-2 / ADR-113). A cheap LOCAL LLM
# summarises every KG class into one retrieval sentence + a synonym list, which
# enriches the PUSH Class-Summary cache (search optimisation) and RuVector
# ns:ontology-classes. Replaces the old Haiku mesh with an operator-supplied
# endpoint. OpenAI-compatible (/chat/completions) or ollama (/api/chat).
# Vanilla agentbox ships this OFF — it is operator infrastructure. The model
# runs behind the Ontology Loom façade (model-swap door) — concurrency can
# be raised if the KV budget allows.
[skills.ontology.condense]
enabled = true
endpoint = "http://192.168.2.132:8084/v1"   # Ontology Loom façade (model-swap door; DNAT via ml). Was the dead .48 host.
model = "qwen3.8-27B"
style = "openai"                            # openai | ollama
max_concurrency = 2                         # llama.cpp serves multiple KV slots
# C7 / ADR-113: the condensation index has no natural trigger — nothing re-runs
# it when GitHubSync/elevation rewrites the logseq corpus, so the class index
# silently goes stale. This wires a manifest-gated staleness scheduler
# (scripts/ontology-condense-scheduler.mjs) that re-runs ontology-condense-refresh.sh
# when the corpus is newer than the last condense output, or on a max-age safety
# floor. Idempotent, flock-serialised, fail-open. Runs as an operator-started
# detached loop today (no image rebuild) and is durably staged as a supervisord
# program for the next image (mirrors the ruvector-aggregate-sweep pattern).
schedule_enabled = true                     # run the periodic staleness scheduler
schedule_interval_mins = 60                 # tick cadence (jittered ±20%)
schedule_max_age_hours = 24                 # rebuild even without corpus change past this age

# ── [vault] — the authored corpus (ADR-2028 / ADR-2029) ──────────────────────
# TOP-LEVEL section, parked next to [skills.ontology] because the ontology
# surfaces are its heaviest consumer. This is the SINGLE path authority for the
# authored knowledge corpus: the entrypoint resolves it into VAULT_ROOT /
# VAULT_PAGES / VAULT_FORMAT / VAULT_TUI for every supervised program, every
# tmux window and every MCP server, and ONTOLOGY_PAGES_DIR is derived from it.
# No consumer hard-codes a corpus path (VAULT-corpus-format Invariant 3) — one
# edit here relocates the corpus for every agent surface. Absent [vault] is
# FAIL-LOUD, not fail-quiet: the boot prints "[vault] disabled" and the corpus
# consumers switch themselves off rather than index a stale tree.
# format: "obsidian" is the one format writers emit (YAML frontmatter, V2);
# "logseq-legacy" is READ-tolerance only for an unconverted graph.
# tui: "rune" bakes the Rune markdown TUI into the image and opens tmux
# window 9 "Notes" at the root (ADR-2029). REBUILD-class — the binary is in the
# Nix package set only when this is "rune".
[vault]
root   = "/home/devuser/workspace/visionGraph/knowledge"   # Obsidian vault root = the visionGraph corpus repo (knowledge/ vault); bind-mounted
pages  = "pages"                            # authored pages, relative to root
format = "obsidian"                         # obsidian | logseq-legacy (read-tolerance only)
tui    = "rune"                             # rune | none — see ADR-2029
# Second vault root (the working graph): pages at <working>/pages. Exported as
# VAULT_WORKING_ROOT / VAULT_WORKING_PAGES. A layout with more than one vault
# root cannot be expressed by `root` alone (ADR-2028 amendment, 2026-09-02).
working     = "/home/devuser/workspace/visionGraph/working"
# Podcast transcript store (<slug>.md + .enrichment/<slug>.json) read and
# extended by podcast-knowledge-ingest. OUTSIDE both vaults so Obsidian does
# not index it. Exported as VAULT_TRANSCRIPTS.
transcripts = "/home/devuser/workspace/visionGraph/transcripts"

[skills.harness]
# Harness Engineering MCP bridge (ADR-004). Agents inspect harness templates
# to understand guide-sensor pairings for their active topology. Four tools:
# harness_list, harness_inspect, harness_validate, harness_audit.
# Templates live in VisionFlow docs/engineering/templates/.
enabled = true
