# ── Context compression (PRD-016, ADR-034) ─────────────────────────────
# Content-aware compression for agent context windows and storage.
# Uses in-process Rust N-API bindings (headroom-napi crate).
# Gate: compression.enabled = true adds the headroom-napi package to the
# image and activates the compression middleware in management-api.
[compression]
enabled = true                     # headroom-napi crate built; compression active
backend = "sqlite"                 # sqlite | memory (redis deferred)
ttl_minutes = 30                   # CCR cache TTL
max_entries = 1000                 # CCR store capacity (LRU eviction)
target_ratio = 0.15                # aggressive default (keep ~15%)

[compression.slots]
memory = true                      # compress memory search results
pods = true                        # compress pod writes
events = false                     # NEVER compress audit trail
beads = true                       # compress bead payloads
orchestrator = false               # skip orchestrator coordination

[compression.algorithms]
smart_crusher = true               # JSON array compression
log_compressor = true              # template-based log compression
diff_compressor = true             # unified diff compression

[observability]
metrics_port = 9091
otlp_endpoint = ""
log_level = "info"

[security]
# ADR-007 W021: when one or more feature exceptions widen the attack surface
# beyond the hardened baseline (cap_add or security_opt_override), the
# operator must explicitly acknowledge the residual risk. The flake fails
# closed at compose-eval time when this is missing while exceptions are
# active. Currently SYS_ADMIN (chromium sandbox) and NET_ADMIN (tailscale
# userspace tun) are widening caps; review docs/user/configuration.md for
# the residual attack surface analysis before flipping this to true.
audit_acknowledged = true

# Feature-specific exceptions to the hardened baseline.
# Each key must match an enabled feature gate (validator rule E020).
# Add the exception block when you enable the corresponding feature.
# Reference table of all known exceptions is in docs/reference/adr/ADR-007-runtime-contract-and-container-hardening.md.
#
# Currently enabled feature exceptions (mirrors active feature gates above):

# Required because adapters.pods = "local-solid-rs" is the only supported
# implementation (ADR-010; the legacy local-jss Python stub was removed
# 2026-04-25). solid-pod-rs needs a writable path under read_only:true
# for its filesystem backend — .meta and .acl sidecars plus atomic-rename
# temp files.
[security.exceptions.solid-pod-rs]
writable_volumes = ["solid-data:/var/lib/solid"]
reason = "solid-pod-rs fs-backend requires atomic-rename writable storage under /var/lib/solid"

# [security.exceptions.playwright] intentionally absent — playwright is
# superseded by the external browsercontainer sidecar (no local chromium).

[security.exceptions.desktop]
# X11 abstract socket dir (mode 1777 sticky — the canonical X11 perm) and
# devuser's runtime dir (XDG_RUNTIME_DIR convention: 0700, owned by uid).
# Without explicit mode/uid, Docker creates these root-owned at default
# tmpfs perms, so devuser-side X clients fail to bind/connect.
tmpfs = ["/tmp/.X11-unix:mode=1777", "/run/user/1000:mode=700,uid=1000,gid=1000"]

[security.exceptions.code-server]
writable_volumes = ["codeserver-config:/home/devuser/.local/share/code-server"]

[security.exceptions.gpu-cuda]
writable_volumes = []
reason = "CUDA runtime requires device access; no additional writable volumes needed"

[security.exceptions.tailscale]
writable_volumes = ["tailscale-state:/var/lib/tailscale"]
cap_add = ["NET_ADMIN"]
reason = "tailscaled needs persistent state dir and NET_ADMIN for userspace networking socket"

# ── Dream Machine HP annexe (ADR-052/053) ─────────────────────────────────────
# Overnight evidence-gated evolution against nominated repos, dispatched to HP
# (10.10.10.1, 25G rail) using the self-hosted Loom/Qwen model exclusively.
# Off by default (byte-identical-when-off). Enable to start nightly cycles.
[dream_machine]
enabled                = true
hp_host                = "john@10.10.10.1"
hp_annexe_dir          = "/home/john/dream-annexe"
loom_url               = "http://192.168.2.132:8084/v1"
loom_model             = "qwen3.8-27B"
# Token budgets must cover reasoning + content: glm-5.3 burned ~16k tokens of
# thinking on hard nights (2026-09-01) and hit the old 16384 cap with empty
# content twice. Env overrides: ZAI_MAX_TOKENS / LOOM_MAX_TOKENS.
loom_max_tokens        = 32768
# LLM provider: "zai" (GLM via Z.AI, Anthropic Messages API — the default) or
# "loom" (self-hosted Loom façade, OpenAI chat-completions). Override at runtime
# with DREAM_LLM_PROVIDER. The Z.AI credential ZAI_ANTHROPIC_API_KEY is a SECRET
# inherited from the container environment — it is never written into agentbox.toml
# or the generated supervisor block.
llm_provider           = "zai"
zai_model              = "glm-5.3"
zai_max_tokens         = 32768
# Evaluator-liveness discipline (darwin lesson, ADR-099 upstream): target repos
# declare their own evaluators in their dream.config.json evaluatorEntrypoints.
# Any @metaharness/darwin entrypoint MUST pass `--sandbox mock` (or `--sandbox
# agent`) — the default 'real' sandbox is documented surface-independent, so it
# emits the same output regardless of the code under test and the night silently
# no-ops. Every entrypoint must provably produce surface-dependent output.
# UTC hours: nightly window (only runs inside this range in --loop mode)
window_start           = 1
window_end             = 5
# RuVector namespace for dream-cycle memories
memory_namespace       = "dream-cycle"
# Recall gate band (ADR-052 §2.4, re-frozen 2026-08-14 post-v4.0.36)
recall_band_self_min   = 175
recall_band_true_min   = 102
# Roster: every eligible nominated repo dreams each night (serial), capped.
max_repos_per_night    = 5
# Standby pruning: a repo whose last N ledger rows are ALL INCONCLUSIVE is
# skipped in nightly mode (REJECT counts as learning and resets the streak;
# revive via --target or a harness fix that yields a decisive verdict).
prune_dry_streak       = 5

[security.exceptions.nostr-relay]
writable_volumes = ["nostr-relay-data:/var/lib/nostr-relay"]
reason = "nostr-rs-relay SQLite journal and WAL require a writable durable path"

[security.exceptions.consultants]
writable_volumes = ["consultations-data:/var/lib/agentbox/consultations"]
reason = "consultant tier writes JSONL audit log per call"
